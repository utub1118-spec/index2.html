<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JetTon Games · Тост-сайт (SWILL)</title>
    <style>
        /* Сброс стилей и базовые настройки (все остальное генерируется скриптом) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0d1a;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }
        /* Небольшой запас, если скрипт ещё не загрузился */
        .loading-placeholder {
            color: #f0f3fa;
            text-align: center;
            padding: 4rem 2rem;
            font-size: 1.5rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <!-- Контент будет полностью сгенерирован JavaScript ниже -->
    <div class="loading-placeholder">⏳ Загрузка JetTon Games ...</div>

    <script>
        // ============================================================
        // SWILL · ПОЛНЫЙ СКРИПТ САЙТА jtrednavo.com (ТОСТ-ВЕРСИЯ)
        // Включает: все игры, бонусы, таблицу, лайв-слоты, СБП, звуки
        // Версия: 1.0 · Дата: 26.09.2025
        // ============================================================

        (function() {
            "use strict";

            // ---------- ДАННЫЕ (все детали с оригинального сайта) ----------
            const GAME_LIST = [
                "Jade Dancer", "Pateplay", "Lucky Patrick Coins: Hold & Win", "Gamebeat",
                "8s on Fire: Supercharged", "Penguin King", "Cash Connection Charming Lady",
                "Novomatic Premium", "Dragon Boyz", "Red Tiger", "Fish Tales Colossal Catch: Link & Loot",
                "BoomingGames", "Gold Digger", "Boldplay", "Ice Bass", "Belatra Games",
                "Rocket Eruption: Triple Blast", "BGaming", "Superstar Sevens", "Hacksawgaming",
                // дублируем для плотности (как на оригинале)
                "Jade Dancer", "Pateplay", "Lucky Patrick Coins", "Gamebeat",
                "8s on Fire", "Penguin King", "Cash Connection", "Novomatic",
                "Dragon Boyz", "Red Tiger", "Fish Tales", "BoomingGames",
                "Gold Digger", "Boldplay", "Ice Bass", "Belatra",
                "Rocket Eruption", "BGaming", "Superstar Sevens", "Hacksaw"
            ];

            const BONUS_DATA = {
                welcome: "425% + 250 FS",
                sports: "1 600 $ для спорта",
                drops: "25 000 000 € в Drops & Wins",
                jetSky: "10 000 $ в Jet Sky Captains",
                spinoleague: "12 000 000 € в Spinoleague 2026",
                bgaming: "1 000 000 € в BGaming Million Drops",
                slotFiesta: "30 000 € в Slot Fiesta"
            };

            const SBP_INFO = {
                label: "СБП",
                number: "+7 999 714 13 32",
                bank: "СБЕРБАНК",
                recipient: "JET TON GAMES"
            };

            // ---------- СОСТОЯНИЕ ИГРЫ ----------
            let state = {
                balance: 5000,
                currentGame: GAME_LIST[0],
                betAmount: 100,
                multiplier: 1.0,
                lastWin: 0,
                history: [],
                isSpinning: false
            };

            // ---------- ЗВУКОВОЙ ДВИЖОК (Web Audio) ----------
            function playTone(freq, duration, type = 'sine', volume = 0.25) {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = freq;
                    osc.type = type;
                    gain.gain.setValueAtTime(volume, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
                    osc.start();
                    osc.stop(ctx.currentTime + duration);
                } catch (_) { /* браузер может блокировать AudioContext */ }
            }

            function soundWin() {
                playTone(880, 0.15);
                setTimeout(() => playTone(1100, 0.12), 120);
                setTimeout(() => playTone(1320, 0.1), 240);
            }

            function soundLose() {
                playTone(220, 0.35, 'sawtooth', 0.15);
            }

            function soundSpin() {
                playTone(600, 0.08);
                setTimeout(() => playTone(500, 0.08), 80);
                setTimeout(() => playTone(400, 0.08), 160);
            }

            // ---------- ТОСТ-СИСТЕМА ----------
            let toastTimeout = null;

            function showToast(message, isGood = true) {
                const toast = document.getElementById('mainToast');
                if (!toast) return;
                const originalHTML = toast.innerHTML;
                const color = isGood ? '#2e3a6b' : '#5a2a3a';
                toast.style.transition = 'all 0.2s';
                toast.style.background = color;
                toast.style.borderColor = isGood ? '#f7c948' : '#ff6b6b';
                toast.innerHTML = `🍾 ${message}`;
                if (toastTimeout) clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.innerHTML = originalHTML;
                    toast.style.background = 'rgba(20, 25, 50, 0.92)';
                    toast.style.borderColor = '#f7c948';
                }, 2800);
            }

            // ---------- РЕНДЕРИНГ ВСЕГО DOM (все детали) ----------
            function renderFullSite() {
                // Очищаем body
                document.body.innerHTML = '';
                document.body.style.cssText = `
                    background: linear-gradient(145deg, #0b0d1a 0%, #1a1f35 100%);
                    font-family: 'Segoe UI', system-ui, sans-serif;
                    color: #f0f3fa;
                    padding: 2rem 1rem;
                    min-height: 100vh;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    margin: 0;
                `;

                const container = document.createElement('div');
                container.className = 'container';
                container.style.cssText = 'max-width:1300px; width:100%;';

                // ----- 1. ТОСТ (верхняя плашка) -----
                const toast = document.createElement('div');
                toast.id = 'mainToast';
                toast.className = 'toast';
                toast.style.cssText = `
                    background: rgba(20, 25, 50, 0.92);
                    backdrop-filter: blur(8px);
                    border: 1px solid #f7c948;
                    border-radius: 2rem;
                    padding: 1.2rem 2.5rem;
                    margin-bottom: 2rem;
                    display: inline-flex;
                    align-items: center;
                    gap: 1.5rem;
                    flex-wrap: wrap;
                    box-shadow: 0 12px 40px rgba(247, 201, 72, 0.25);
                    font-weight: 500;
                    letter-spacing: 0.3px;
                    width: 100%;
                    justify-content: center;
                    transition: all 0.3s;
                `;
                toast.innerHTML = `
                    <span style="background:#f7c948; color:#0b0d1a; padding:0.3rem 1.2rem; border-radius:40px; font-weight:700;">🎉 ТОСТ-САЙТ</span>
                    <span style="background:#2e3a6b; color:#f7c948; padding:0.3rem 1.2rem; border-radius:40px;">🔥 ${BONUS_DATA.welcome}</span>
                    <span>•</span>
                    <span style="background:#2e3a6b; padding:0.3rem 1.2rem; border-radius:40px;">СБП ПРИОРИТЕТ</span>
                    <span>•</span>
                    <span style="background:#2e3a6b; padding:0.3rem 1.2rem; border-radius:40px; font-weight:700;">${SBP_INFO.number}</span>
                `;
                container.appendChild(toast);

                // ----- 2. БАННЕР С БОНУСАМИ -----
                const banner = document.createElement('div');
                banner.className = 'bonus-banner';
                banner.style.cssText = `
                    background: radial-gradient(circle at 20% 30%, #2f3b70, #141b33);
                    border-radius: 3rem;
                    padding: 2rem 2rem 1.8rem;
                    margin: 1.5rem 0 2.5rem;
                    border: 1px solid #4e5b8a;
                    text-align: center;
                    box-shadow: 0 8px 0 #0b0d1a;
                `;
                banner.innerHTML = `
                    <h1 style="font-size:2.8rem; font-weight:800; background:linear-gradient(135deg,#f7c948,#ffb347); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; letter-spacing:1px;">Welcome bonus ${BONUS_DATA.welcome}</h1>
                    <p style="font-size:1.3rem; color:#c8d0ea; margin-top:0.3rem;">или ${BONUS_DATA.sports}</p>
                    <p style="font-size:1rem; margin-top:0.8rem; color:#b8c6f0;">
                        ${BONUS_DATA.jetSky} · ${BONUS_DATA.spinoleague} · ${BONUS_DATA.bgaming} · ${BONUS_DATA.slotFiesta}
                    </p>
                `;
                container.appendChild(banner);

                // ----- 3. ОСНОВНАЯ СЕТКА (игры + таблица) -----
                const grid = document.createElement('div');
                grid.style.cssText = 'display:grid; grid-template-columns:2fr 1fr; gap:2rem; margin:2rem 0;';
                grid.className = 'grid-2col';

                // Левая колонка: все игры
                const leftCol = document.createElement('div');
                const gamesTitle = document.createElement('h2');
                gamesTitle.style.cssText = 'margin-bottom:0.8rem; font-weight:300; letter-spacing:2px; color:#b2c2f0;';
                gamesTitle.textContent = '🎰 Случайная игра';
                leftCol.appendChild(gamesTitle);

                const gameGrid = document.createElement('div');
                gameGrid.className = 'game-grid';
                gameGrid.style.cssText = `
                    display: grid;
                    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                    gap: 1rem;
                    background: rgba(18, 24, 48, 0.6);
                    padding: 1.5rem;
                    border-radius: 2.5rem;
                    border: 1px solid #31406b;
                `;
                GAME_LIST.forEach(name => {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.textContent = name;
                    card.style.cssText = `
                        background: #202841;
                        border-radius: 1.8rem;
                        padding: 1rem 0.5rem;
                        text-align: center;
                        font-size: 0.85rem;
                        font-weight: 600;
                        border: 1px solid #3f4f7a;
                        transition: 0.15s;
                        box-shadow: 0 4px 0 #0f1325;
                        color: #d6def5;
                        cursor: pointer;
                    `;
                    card.addEventListener('click', function() {
                        state.currentGame = this.textContent.trim();
                        updateUI();
                        showToast(`🎯 Игра: ${state.currentGame}`);
                        this.style.borderColor = '#f7c948';
                        this.style.background = '#2a3560';
                        setTimeout(() => {
                            this.style.borderColor = '#3f4f7a';
                            this.style.background = '#202841';
                        }, 400);
                    });
                    // Hover эффект
                    card.addEventListener('mouseenter', function() {
                        this.style.transform = 'scale(0.97)';
                        this.style.background = '#2a3560';
                        this.style.borderColor = '#f7c948';
                    });
                    card.addEventListener('mouseleave', function() {
                        this.style.transform = 'scale(1)';
                        this.style.background = '#202841';
                        this.style.borderColor = '#3f4f7a';
                    });
                    gameGrid.appendChild(card);
                });
                leftCol.appendChild(gameGrid);
                grid.appendChild(leftCol);

                // Правая колонка: таблица ставок
                const rightCol = document.createElement('div');
                rightCol.className = 'betting-table';
                rightCol.style.cssText = `
                    background: #151d35;
                    border-radius: 2.5rem;
                    padding: 1.5rem 1.2rem;
                    border: 1px solid #3a4a77;
                    height: fit-content;
                `;
                rightCol.innerHTML = `
                    <h3 style="font-size:1.6rem; margin-bottom:1.2rem; color:#f7c948; border-bottom:2px dashed #3f4f7a; padding-bottom:0.6rem;">📊 Betting Table</h3>
                    <div class="table-row" style="display:flex; justify-content:space-between; padding:0.7rem 0.2rem; border-bottom:1px solid #2c3960; font-size:1rem;">
                        <span>Game</span>
                        <span id="gameDisplay" style="color:#f7c948;">${state.currentGame}</span>
                    </div>
                    <div class="table-row" style="display:flex; justify-content:space-between; padding:0.7rem 0.2rem; border-bottom:1px solid #2c3960; font-size:1rem;">
                        <span>User</span>
                        <span style="color:#b2c2f0;">Player_07</span>
                    </div>
                    <div class="table-row" style="display:flex; justify-content:space-between; padding:0.7rem 0.2rem; border-bottom:1px solid #2c3960; font-size:1rem;">
                        <span>Bet amount</span>
                        <span id="betDisplay" style="color:#b2c2f0; cursor:pointer;">${state.betAmount} €</span>
                    </div>
                    <div class="table-row" style="display:flex; justify-content:space-between; padding:0.7rem 0.2rem; border-bottom:2px solid #f7c948; font-size:1rem;">
                        <span>Multiplier</span>
                        <span id="multDisplay" style="color:#f7c948;">x${state.multiplier.toFixed(1)}</span>
                    </div>
                    <div class="table-row" style="display:flex; justify-content:space-between; padding:0.7rem 0.2rem; margin-top:0.5rem; background:#1f2b50; border-radius:2rem; padding:0.6rem 1rem;">
                        <span>🔥 Выигрыш</span>
                        <span id="winDisplay" style="color:#f7c948; font-weight:700;">${state.lastWin} €</span>
                    </div>
                    <div class="table-row balance-row" style="display:flex; justify-content:space-between; padding:0.7rem 0.2rem; border-bottom:1px solid #2c3960; font-size:1rem;">
                        <span>💰 Баланс</span>
                        <span id="balanceDisplay" style="color:#f7c948; font-weight:700;">${state.balance} €</span>
                    </div>
                `;
                // Кнопка SPIN
                const spinBtn = document.createElement('button');
                spinBtn.textContent = '🎰 SPIN (live)';
                spinBtn.style.cssText = `
                    background: #f7c948;
                    border: none;
                    color: #0b0d1a;
                    font-weight: 800;
                    padding: 0.8rem 2.5rem;
                    border-radius: 60px;
                    font-size: 1.1rem;
                    margin-top: 1.2rem;
                    cursor: pointer;
                    transition: 0.15s;
                    box-shadow: 0 6px 0 #a57d2e;
                    width: 100%;
                `;
                spinBtn.addEventListener('click', spinSlot);
                rightCol.appendChild(spinBtn);
                grid.appendChild(rightCol);
                container.appendChild(grid);

                // ----- 4. БЛОК ОПЛАТЫ (только СБП) -----
                const paymentSection = document.createElement('div');
                paymentSection.className = 'payment-section';
                paymentSection.style.cssText = `
                    background: #0e1429;
                    border-radius: 3rem;
                    padding: 2rem 2rem 1.8rem;
                    margin: 2.5rem 0 1rem;
                    border: 2px solid #f7c948;
                    text-align: center;
                `;
                paymentSection.innerHTML = `
                    <div style="font-size:1.5rem; margin-bottom:0.8rem; color:#d6def5; text-transform:uppercase; letter-spacing:4px;">💳 ОПЛАТА</div>
                    <div id="sbpBlock" style="background:#1f2b50; padding:1.8rem 1rem; border-radius:3rem; font-size:2.2rem; font-weight:700; letter-spacing:2px; color:#f7c948; word-break:break-all; border:1px solid #f7c948; box-shadow:0 0 20px rgba(247,201,72,0.3); cursor:pointer;">
                        ${SBP_INFO.label}
                        <small style="display:block; font-size:1rem; font-weight:400; color:#b2c2f0; margin-top:0.5rem;">Система быстрых платежей</small>
                        <span style="display:block; font-size:2.8rem; margin:0.3rem 0; background:#0b0d1a; padding:0.3rem 0.8rem; border-radius:60px; border:1px solid #f7c948;">
                            ${SBP_INFO.number}
                        </span>
                        <small style="color:#f7c948;">${SBP_INFO.bank} · Получатель: ${SBP_INFO.recipient}</small>
                    </div>
                    <button id="sbpPayBtn" style="background:#f7c948; border:none; color:#0b0d1a; font-weight:800; padding:0.8rem 2.5rem; border-radius:60px; font-size:1.1rem; margin-top:1.2rem; cursor:pointer; transition:0.15s; box-shadow:0 6px 0 #a57d2e;">
                        📱 ОПЛАТИТЬ ЧЕРЕЗ СБП
                    </button>
                    <p style="margin-top:1rem; font-size:0.9rem; color:#8f9fd0;">Нажмите для копирования номера или пополнения баланса</p>
                `;
                container.appendChild(paymentSection);

                // ----- 5. Дополнительный тост-баннер внизу -----
                const bottomToast = document.createElement('div');
                bottomToast.style.cssText = `
                    background: #111833;
                    border-radius: 3rem;
                    padding: 1rem 2rem;
                    margin: 1.5rem 0;
                    text-align: center;
                    border: 1px solid #3a4a77;
                `;
                bottomToast.innerHTML = `<span style="font-size:1.3rem;">🍾 Сделай тост — пополни через СБП ${SBP_INFO.number}</span>`;
                container.appendChild(bottomToast);

                // Футер
                const footer = document.createElement('div');
                footer.style.cssText = 'margin-top:2.5rem; color:#6a7aa8; font-size:0.8rem; text-align:center;';
                footer.textContent = 'JetTon Games · тост-версия по протоколу SWILL · все призы и бонусы действительны';
                container.appendChild(footer);

                document.body.appendChild(container);

                // ---------- ПРИВЯЗКА СОБЫТИЙ ----------
                // Редактирование ставки (двойной клик)
                document.getElementById('betDisplay').addEventListener('dblclick', function() {
                    const newBet = prompt('Введите новую ставку (€):', state.betAmount);
                    if (newBet && !isNaN(newBet) && parseInt(newBet) > 0) {
                        state.betAmount = parseInt(newBet);
                        this.textContent = state.betAmount + ' €';
                    }
                });

                // СБП: клик по блоку и кнопке
                const sbpBlock = document.getElementById('sbpBlock');
                const sbpBtn = document.getElementById('sbpPayBtn');

                function handleSBP() {
                    const amount = prompt('Пополнить баланс через СБП (сумма в €):', '100');
                    if (amount && !isNaN(amount) && parseInt(amount) > 0) {
                        state.balance += parseInt(amount);
                        updateUI();
                        showToast(`✅ Баланс пополнен на ${amount} € через СБП`);
                        // Копирование номера
                        navigator.clipboard?.writeText(SBP_INFO.number).then(() => {
                            showToast(`📋 Номер ${SBP_INFO.number} скопирован`, true);
                        }).catch(() => {});
                        soundWin();
                    }
                }

                sbpBlock.addEventListener('click', handleSBP);
                sbpBtn.addEventListener('click', handleSBP);

                // Начальное обновление UI
                updateUI();
                console.log('SWILL · Полный сайт загружен, все детали активны');
            }

            // ---------- ФУНКЦИЯ ОБНОВЛЕНИЯ UI ----------
            function updateUI() {
                const gameDisplay = document.getElementById('gameDisplay');
                const betDisplay = document.getElementById('betDisplay');
                const multDisplay = document.getElementById('multDisplay');
                const winDisplay = document.getElementById('winDisplay');
                const balanceDisplay = document.getElementById('balanceDisplay');

                if (gameDisplay) gameDisplay.textContent = state.currentGame;
                if (betDisplay) betDisplay.textContent = state.betAmount + ' €';
                if (multDisplay) multDisplay.textContent = 'x' + state.multiplier.toFixed(1);
                if (winDisplay) winDisplay.textContent = state.lastWin + ' €';
                if (balanceDisplay) balanceDisplay.textContent = state.balance + ' €';
            }

            // ---------- ОСНОВНОЙ СПИН (ЛАЙВ-СЛОТ) ----------
            function spinSlot() {
                if (state.isSpinning) return;
                if (state.balance < state.betAmount) {
                    showToast('❌ Недостаточно средств! Пополни через СБП', false);
                    return;
                }

                state.isSpinning = true;
                soundSpin();

                // Визуальный эффект на всех картах
                const cards = document.querySelectorAll('.game-card');
                cards.forEach((card, idx) => {
                    card.style.transition = '0.1s';
                    card.style.transform = 'scale(0.9)';
                    card.style.background = '#3f4f7a';
                    setTimeout(() => {
                        card.style.transform = 'scale(1)';
                        card.style.background = '#202841';
                    }, 100 + idx * 15);
                });

                // Генерация результата
                const multiplier = parseFloat((Math.random() * 49 + 1).toFixed(1));
                const win = Math.round(state.betAmount * multiplier);
                const isWin = multiplier > 1.0;

                // Задержка (имитация реального времени)
                setTimeout(() => {
                    state.multiplier = multiplier;
                    state.lastWin = isWin ? win : 0;

                    if (isWin) {
                        state.balance += win;
                        soundWin();
                        showToast(`🎉 ВЫИГРЫШ! +${win} € (x${multiplier.toFixed(1)})`);
                    } else {
                        state.balance -= state.betAmount;
                        soundLose();
                        showToast(`😔 Проигрыш. x${multiplier.toFixed(1)}`, false);
                    }

                    // История
                    state.history.push({
                        game: state.currentGame,
                        bet: state.betAmount,
                        win: isWin ? win : 0,
                        mult: multiplier
                    });
                    if (state.history.length > 10) state.history.shift();

                    updateUI();
                    state.isSpinning = false;
                }, 800);
            }

            // ---------- ЗАПУСК ----------
            // Ждём загрузку DOM
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', renderFullSite);
            } else {
                renderFullSite();
            }

        })();
    </script>
</body>
</html>
